<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX Shipping">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>FX Shipping</title>
<style>
/* Layout: sticky navy bridge bar + tabs, single centred column of cards on a cool white sea */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --ink:#0C1F3A; --muted:#566884; --line:#D9E3EF;
  --accent:#1557C0; --accent-ink:#FFFFFF; --soft:#E4EEFB;
  --hdr:#0B2545; --hdr-ink:#FFFFFF; --hdr-muted:#A9BEDC;
  --good:#1C7C54; --good-soft:#E3F3EB; --warn:#9A6400; --warn-soft:#FBF0DC; --bad:#BC3328; --bad-soft:#FBE7E5;
  --shade:rgba(11,37,69,.45);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#081325; --surface:#0F1F38; --ink:#E7EEF8; --muted:#93A5C1; --line:#1F3459;
  --accent:#5E9DFF; --accent-ink:#04122A; --soft:#14305A;
  --hdr:#050D1B; --hdr-ink:#FFFFFF; --hdr-muted:#8EA5C8;
  --good:#4CC38A; --good-soft:#0F3326; --warn:#E3B04B; --warn-soft:#3A2C0E; --bad:#F27B6E; --bad-soft:#3D1A17;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081325; --surface:#0F1F38; --ink:#E7EEF8; --muted:#93A5C1; --line:#1F3459;
  --accent:#5E9DFF; --accent-ink:#04122A; --soft:#14305A;
  --hdr:#050D1B; --hdr-ink:#FFFFFF; --hdr-muted:#8EA5C8;
  --good:#4CC38A; --good-soft:#0F3326; --warn:#E3B04B; --warn-soft:#3A2C0E; --bad:#F27B6E; --bad-soft:#3D1A17;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.co{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12.5px;color:var(--hdr-muted)}
.cashpill{text-align:right}
.cashpill small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hdr-muted)}
.cashpill b{font-family:var(--f-num);font-size:16px}
.cashpill b.neg{color:#FF9B90}
.btn-end{background:#FFFFFF;color:#0B2545;border:0;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn-end:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--hdr-muted);padding:9px 12px 11px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:#FFFFFF;border-bottom-color:#7FB2FF}

main{padding-block:18px 48px;display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* kpis */
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal-top .big{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-num);font-size:17px;font-weight:600}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* market */
.mkt{display:grid;gap:12px}
.bunker{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bunker .price{font-family:var(--f-num);font-size:24px;font-weight:600}
.idx-row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.idx-track{height:6px;background:var(--soft);border-radius:99px;position:relative}
.idx-track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.idx-track u{position:absolute;left:37.5%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.up{color:var(--good)} .down{color:var(--bad)}

/* p&l */
.pl{display:grid;gap:6px;font-size:14px}
.pl div{display:flex;justify-content:space-between;gap:12px}
.pl .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700}

/* log */
.log{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:66px 1fr;gap:10px;font-size:14px}
.log .m{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:2px}
.log .bad{color:var(--bad)} .log .good{color:var(--good)}

/* ships */
.ships,.offers{display:grid;gap:12px}
.ship-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ship-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-idle{background:var(--soft);color:var(--accent)}
.p-voy{background:var(--good-soft);color:var(--good)}
.p-dock{background:var(--warn-soft);color:var(--warn)}
.p-del{background:var(--soft);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin-top:4px}
.facts b{color:var(--ink);font-weight:600}
.cond{margin-top:12px;font-size:13px}
.cond .bar{height:7px;margin-top:6px}
.cond.ok .bar>i{background:var(--good)} .cond.mid .bar>i{background:var(--warn)} .cond.low .bar>i{background:var(--bad)}
.voyage{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

/* offers */
.chip{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--soft);padding:3px 8px;border-radius:6px}
.route{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:8px;line-height:1.25}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.money div{background:var(--bg);border-radius:10px;padding:8px 10px}
.money small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.money b{font-family:var(--f-num);font-size:14.5px}
@media (max-width:420px){.money{grid-template-columns:1fr 1fr}}
.assign{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.assign select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px}
.help{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:14px}
.help b{color:var(--accent)}

/* manage */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.setting+.setting{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.setting h3,.card h3{font-family:var(--f-display);font-size:17px;margin:0}
.dept{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.dept li{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:14px}
.dept b{font-weight:700}
dl.gloss{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:14px}
dl.gloss dt{font-weight:700} dl.gloss dd{margin:0;color:var(--muted)}
@media (max-width:460px){.dept li,dl.gloss{grid-template-columns:1fr}.dept li{gap:0}dl.gloss dd{margin-bottom:6px}}

/* fleet tabs, naming, memos */
main>*{min-width:0}
.wage-row+.setting{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.subtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.subtabs button span{font-family:var(--f-num);font-size:12px;margin-left:4px;opacity:.8}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.namebox{margin-top:12px;display:grid;gap:6px}
.namebox label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.namebox input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;min-width:0}
.namebox input:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.memo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.memo li{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px}
.seg5{flex-wrap:wrap}.seg5 button{flex:1 1 30%;font-size:13px}
.seg button small{font-weight:500;opacity:.85}
.hbar-list{display:grid;gap:4px}

/* start */
.start{padding-block:32px 48px;display:grid;gap:18px}
.hero{background:var(--hdr);color:#FFFFFF;border-radius:18px;padding:26px 22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:#C3D4EC;max-width:52ch}
.hero svg{position:absolute;right:-10px;bottom:-6px;width:220px;opacity:.18}
label.field{display:grid;gap:6px;font-weight:600}
label.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:500}
.plans{display:grid;gap:10px}
.plan{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.plan b{font-family:var(--f-display);font-size:17px;display:block}
.plan span{font-size:14px;color:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#modal{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:6px 0 10px;text-wrap:balance}
.sheet p{margin:0 0 12px}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.choice:hover{border-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:13.5px;color:var(--muted)}
.result{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sheet .btn.primary{width:100%;padding:12px}
.notes{margin:0 0 14px;padding-left:18px;font-size:14px;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}

/* crewing, payroll, finance */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent);margin-right:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.kpis.k3{grid-template-columns:repeat(2,1fr)}}
.certs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.cert{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--good-soft);color:var(--good);border:0}
.cert.miss{background:var(--bad-soft);color:var(--bad)}
.cert.tank{background:var(--soft);color:var(--accent)}
button.cert{cursor:pointer} button.cert:hover{outline:1px solid var(--bad)}
.crew-row{padding-block:12px;border-top:1px solid var(--line)}
.crew-row:first-of-type{border-top:0}
.rk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crew-row .who{font-weight:700;font-size:15.5px}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--f-num);font-size:22px}
.score small{display:block;font-size:11px;color:var(--muted)}
.remark{margin:10px 0 0;font-style:italic}
.wage-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.wage-row:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper b{font-family:var(--f-num);min-width:92px;text-align:center}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;font-size:13.5px;align-items:center}
.hbar .t{height:6px;background:var(--soft);border-radius:99px;grid-column:1/-1;margin-bottom:6px}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar .v{text-align:right;font-family:var(--f-num)}
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filters{display:grid;gap:10px}
.filters .seg{margin-top:0}
.stars{color:var(--accent);font-size:16px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.warnbox{margin-top:12px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
</style>
</head>

<div id="app"></div>
<div id="modal" hidden></div>

<script>

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  mr:{seg:'tanker',nama:'MR Product Tanker',size:'50,000 DWT',value:127.5e6,other:480e3,ratings:19,fuel:800,port:298e3,mk:1.55,scale:1,ldt:11000},
  lr2:{seg:'tanker',nama:'LR2 Product Tanker',size:'115,000 DWT',value:250e6,other:650e3,ratings:20,fuel:1100,port:420e3,mk:1.55,scale:1,ldt:20000},
  bunk:{seg:'bunker',nama:'Bunker Tanker',size:'6,500 DWT',value:34e6,other:190e3,ratings:8,fuel:120,port:64e3,mk:1.66,scale:0.6,ldt:2200},
  lpg:{seg:'gas',nama:'LPG Carrier (MGC)',size:'38,000 cbm',value:210e6,other:620e3,ratings:20,fuel:950,port:350e3,mk:1.55,scale:1,ldt:12000},
  psv:{seg:'offshore',nama:'Platform Supply Vessel',size:'4,000 DWT',value:48e6,other:240e3,ratings:12,fuel:250,port:30e3,mk:1.62,scale:0.85,ldt:2500},
  ahts:{seg:'offshore',nama:'Anchor Handling Tug (AHTS)',size:'80 t bollard pull',value:70e6,other:320e3,ratings:14,fuel:350,port:35e3,mk:1.62,scale:0.9,ldt:3200}
};

function capIn(a){st.cash+=a;st.cur.cap.sell+=a}
const sumObj=o=>Object.values(o).reduce((a,b)=>a+b,0);
function addLog(t,tone,cat){st.log.unshift({m:st.m,t,tone:tone||'',cat:cat||''});st.log=st.log.slice(0,60)}
function fix(){['rep','morale','board','empRep','omorale'].forEach(k=>st[k]=clamp(st[k],0,100))}

/* ---------- generators ---------- */
function nameTaken(n){n=n.trim().toLowerCase();return st.ships.some(x=>x.name.toLowerCase()===n)||st.orders.some(o=>o.name&&o.name.toLowerCase()===n)}
function checkName(n){n=(n||'').trim().replace(/\s+/g,' ');if(!n)return {ok:true,n:''};if(n.length<2)return {ok:false,e:'Name is too short.'};if(n.length>30)return {ok:false,e:'Keep the name under 30 characters.'};if(nameTaken(n))return {ok:false,e:'You already have a ship called '+n+'.'};return {ok:true,n}}
function shipName(){const free=SHIPNAMES.filter(n=>!st.used.includes(n));const n=free.length?pick(free):pick(SHIPNAMES)+' '+(st.used.length-SHIPNAMES.length+2);st.used.push(n);return n}
function genSeafarer(rank,o={}){
  const mean=o.mean??(46+st.empRep*0.38);const comp=clamp(Math.round(mean+gauss()*11),30,98);
  const er={master:[12,26],co:[5,14],ce:[12,26],se:[4,13]}[rank];const exp=Math.round(rnd(er[0],er[1]));
  const rep=Math.round(clamp(1.8+comp/32+gauss()*0.35,1.5,5)*10)/10;
  const pc=0.55+comp/250+(o.boost||0);
  const certs=REQ[rank].filter(c=>c==='BST'||Math.random()<pc);
  const sc=o.seg?segCerts(o.seg,rank):[];
  if(sc.length){if(Math.random()<0.5+comp/250+(o.boost||0))certs.push(...sc);else if(Math.random()<0.5)certs.push(sc[0])}
  const nat=pick(Object.keys(PEOPLE));
  return {id:st.nid++,name:pick(PEOPLE[nat]),nat,rank,age:exp+Math.round(rnd(22,27)),exp,comp,rep,certs,
    expect:Math.round(RANKS[rank].mk*(0.8+comp/500+exp/300)/500)*500,left:0,ex:false,exAge:0,flag:false,wage:0,
    remark:pick(REMARKS[rep>=4.3?'hi':rep>=3.4?'mid':'lo'])};
}
function genHead(d,mean){
  const skill=clamp(Math.round((mean??3)+gauss()*0.9),1,5),P=DEPTS[d].pay;
  const nat=Math.random()<0.7?'Malaysian':pick(Object.keys(PEOPLE));
  return {id:st.nid++,name:pick(PEOPLE[nat]),nat,skill,pay:Math.round((P[0]+(P[1]-P[0])*(skill-1)/4)*rnd(0.92,1.08)/500)*500,yrs:Math.round(6+skill*3+rnd(0,6)),note:DEPTS[d].notes[5-skill]};
}
function newShip(cls,age,crewed,name){
  if(name)st.used.push(name);
  const sh={id:st.nid++,name:name||shipName(),totR:0,totC:0,lastNet:0,since:st.m,dockDue:age<1?5:Math.round((age+rnd(0.5,5))*12)/12,cls,age,cond:Math.round(clamp(94-age*1.4+rnd(-4,4),58,95)),status:'idle',left:0,c:null,crew:{master:null,co:null,ce:null,se:null}};
  if(crewed)RK.forEach(r=>{const p=genSeafarer(r,{mean:68,boost:0.3,seg:segOf(cls)});p.left=Math.round(rnd(2,8));sh.crew[r]=p});
  return sh;
}
function genOffer(cls){
  const c=CLS[cls],seg=c.seg,r=pick(ROUTES[seg]),base=earnBase(cls);
  let f=(0.9+st.rep/500)*(0.95+0.1*eff('chartering'))*(1+boostFor(seg))*[1.02,1,0.98][st.pol.credit??1];
  if(seg==='tanker'||seg==='gas')f*=0.93+0.1*eff('marine');
  if(seg==='offshore'||Math.random()<0.32){
    const months=seg==='offshore'?pick([6,9,12,18,24]):pick([4,6,9,12]);
    const hire=r10k((base-c.fuel*2635-c.port)*st.idx[seg]*rnd(0.95,1.1)*f);
    return {id:st.nid++,cls,type:'TC',months,hire,rev:hire*months,who:pick(WHO[seg]),from:r[0],to:seg==='offshore'?r[1]:null,cargo:seg==='offshore'?'Field support for '+r[1]:'Charterer pays fuel and port charges',hra:false};
  }
  return {id:st.nid++,cls,type:'VC',months:r[2],rev:r10k(base*r[2]*st.idx[seg]*rnd(0.88,1.15)*f*(r[4]?1.12:1)),who:pick(WHO[seg]),from:r[0],to:r[1],cargo:r[3],hra:!!r[4]};
}
function genOffers(){
  const bl=st.budget.chartering,cap=[1,2,3,3,4][bl],extra=[0,1,2,2,3][bl];
  const out=[];[...new Set(st.ships.map(s=>s.cls))].forEach(c=>{const n=1+st.ships.filter(s=>s.cls===c&&s.status==='idle').length;for(let i=0;i<Math.min(n,cap);i++)out.push(genOffer(c))});
  const open=Object.keys(CLS).filter(k=>st.divs.includes(segOf(k)));for(let i=0;i<extra;i++)out.push(genOffer(pick(open)));
  st.offers=out.slice(0,18);
}
function genListing(seg){const open=Object.keys(CLS).filter(k=>seg?segOf(k)===seg:st.divs.includes(segOf(k)));const cls=pick(open),age=Math.round(rnd(3,seg?14:18));return {id:st.nid++,cls,age,cond:Math.round(clamp(92-age*1.5+rnd(-6,6),50,95)),price:r10k(valueOf({cls,age})*rnd(0.95,1.1)),seller:pick(['Greek owner','Singapore fund','Japanese owner','Indonesian operator','Norwegian owner','Chinese leasing firm'])}}
function refreshBids(){st.bids={};st.ships.forEach(s=>st.bids[s.id]=r10k(valueOf(s)*rnd(0.9,1.03)))}
function bidFor(sh){if(st.bids[sh.id]==null)st.bids[sh.id]=r10k(valueOf(sh)*rnd(0.9,1.03));return st.bids[sh.id]}
function headPool(d){if(!st.headPool[d]||!st.headPool[d].length)st.headPool[d]=[genHead(d,2),genHead(d,3),genHead(d,4)];return st.headPool[d]}

function estCost(o){const c=CLS[o.cls],cc=crewCost(o.cls,scaleBasic(o.cls),4+c.ratings,true,o.hra);const run=(cc.wages+cc.food+cc.allow+c.other*(0.55+0.45*MAINT[st.maint].mult))*o.months;return o.type==='VC'?o.months*(c.fuel*st.bunker*st.fuelEff+c.port)+run:run}
const estProfit=o=>o.rev-estCost(o);

function upgrade(o){
  o.budget=o.budget||{};o.hc=o.hc||{};o.staff=o.staff||{};o.heads=o.heads||{};
  DK().forEach(d=>{if(o.budget[d]==null)o.budget[d]=2;if(o.staff[d]==null)o.staff[d]=0;if(o.hc[d]==null)o.hc[d]=o.staff[d]});
  if(o.opay==null)o.opay=1;if(!o.oben){o.oben={};OBEN.forEach(b=>o.oben[b.k]=b.def)}
  if(o.oShock==null)o.oShock=0;o.ramp=o.ramp||{};o.recv=o.recv||[];o.oLeft=o.oLeft||[];o.ltvPen=o.ltvPen||0;
  if(o.pol.credit==null)o.pol.credit=1;if(o.pol.hire==null)o.pol.hire=1;
  (o.ships||[]).forEach(sh=>{if(sh.totR==null){sh.totR=0;sh.totC=0;sh.lastNet=0;sh.since=o.m}if(sh.dockDue==null)sh.dockDue=Math.round((sh.age+(sh.status==='dock'?5:1.5+Math.random()*3.5))*12)/12});if(o.pol.autoDock==null)o.pol.autoDock=1;
  o.v=4;return o;
}
function fresh(company,plan){
  st={v:4,company,m:0,cash:0,loan:0,rate:0.065,rep:50,morale:65,board:70,empRep:55,maint:1,hseq:false,fuelEff:1,
      bunker:2615,prevBunker:2615,scrap:2000,idx:{container:1,bulk:0.95,tanker:1.05,bunker:1,gas:1,offshore:0.95},bunkerHist:[2615],
      wages:{master:42000,co:30000,ce:42000,se:28000,rating:7500},allow:{},
      pol:{autoCharter:1,mode:1,minRep:0,needStcw:1,premium:1,autoTrain:1,dockAt:2,autoDock:1,credit:1,hire:1},
      heads:{},staff:{},headPool:{},divs:[],offices:[],
      ships:[],offers:[],market:[],pool:[],bids:{},orders:[],log:[],hist:[],cur:null,neg:0,queue:[],over:null,nid:1,flags:{},used:[],tierMax:0};
  ALLOW.forEach(a=>st.allow[a.k]=a.def);st.cur=newLedger();
  upgrade(st);
  const startStaff={chartering:1,crewing:1,marine:0,technical:1,finance:1,hr:0};
  DK().forEach(d=>{st.heads[d]=genHead(d,3);st.staff[d]=startStaff[d];st.hc[d]=startStaff[d]});
  const P=PLANS[plan];P.ships.forEach(([c,a])=>{st.ships.push(newShip(c,a,true));if(!st.divs.includes(segOf(c)))st.divs.push(segOf(c))});st.cash=P.cash;
  st.morale=moraleTarget();st.omorale=oMoraleTarget();
  st.startNW=netWorth();st.yearNW=st.startNW;st.target=Math.round(st.startNW*1.08/1e6)*1e6;st.reviewNW=st.startNW;
  genOffers();for(let i=0;i<5;i++)st.market.push(genListing());refreshBids();
  addLog('You have been appointed CEO of '+company+'. Board target for 2027: net worth of '+fm(st.target)+'.','');
  autoCharter((t,tn,c)=>addLog(t,tn,c));
  save();
}

/* ---------- department automation ---------- */
function place(sh,r,p,note){
  const cur=sh.crew[r];if(cur)sendHome(cur);
  spend('recruit',p.ex?3500:7500);p.ex=false;p.flag=false;p.left=Math.round(rnd(6,9));sh.crew[r]=p;st.pool=st.pool.filter(x=>x!==p);
  if(st.pol.autoTrain)gapsOf(p,sh.cls).forEach(c=>{spend('train',CERTS[c][2]);p.certs.push(c)});
  note&&note(`Crewing hired ${p.name} as ${RANKS[r].t} on ${sh.name}${cur?', replacing '+cur.name:''}.`,'good');
}
function autoCrew(note){
  const ce=eff('crewing'),mean=36+st.empRep*0.3+ce*24;
  st.ships.forEach(sh=>RK.forEach(r=>{
    const cur=sh.crew[r];if(cur&&!cur.flag)return;
    const seg=segOf(sh.cls);let cands=[0,1,2,3].map(()=>genSeafarer(r,{mean,seg,boost:ce*0.15})).concat(st.pool.filter(p=>p.rank===r));
    cands=cands.filter(p=>p.rep>=MINREP[st.pol.minRep]);
    if(st.pol.needStcw&&!st.pol.autoTrain)cands=cands.filter(p=>!gapsOf(p,sh.cls).length);
    if(cur)cands=cands.filter(p=>p.comp>cur.comp+4);
    cands.sort((a,b)=>b.comp-a.comp);
    const cap=st.wages[r]*(1+PREM[st.pol.premium]);let over=null;
    for(const p of cands){
      if(p.expect<=cap){const offer=Math.max(st.wages[r],p.expect);if(Math.random()<acceptChance(p,offer)){p.wage=offer;place(sh,r,p,(t,tn)=>note(t,tn,'crew'));return}}
      else if(!over)over=p;
    }
    if(cur){cur.flag=false;note(`Crewing found no better ${RANKS[r].t} than ${cur.name} this month.`,'','crew');return}
    if(over&&!st.queue.some(q=>q.id==='premium'))st.queue.push({kind:'event',id:'premium',ship:sh.id,extra:{r,p:over},title:'Crewing Manager requests approval',
      body:`${sh.name} has no ${RANKS[r].t}. The best candidate, ${over.name} (${over.nat}, competence ${over.comp}, reputation ${over.rep.toFixed(1)}), asks for ${full(over.expect)} a month. Your scale is ${full(st.wages[r])} and your policy allows up to ${full(cap)}.`});
    else note(`Crewing could not find a ${RANKS[r].t} for ${sh.name}. The ship cannot sail until one is found.`,'bad','crew');
  }));
}
function autoTrain(){if(!st.pol.autoTrain)return;st.ships.forEach(sh=>filled(sh).forEach(r=>{const p=sh.crew[r];gapsOf(p,sh.cls).forEach(c=>{spend('train',CERTS[c][2]);p.certs.push(c)})}))}
function autoDock(note){
  const t=DOCKAT[st.pol.dockAt];
  st.ships.forEach(sh=>{
    if(st.pol.autoDock&&sh.status==='idle'&&dueIn(sh)<=3&&!tooOld(sh)){const c=dockCost(sh);if(st.cash>c*1.5){enterDock(sh,c,1);note('Technical booked '+sh.name+' into dry dock for its 5-year special survey ('+fm(c)+').','','tech')}else note(sh.name+' is due for its special survey but cash is too low to dry dock.','bad','tech')}
    else if(t&&canShore(sh)&&sh.cond<t){const c=shoreCost(sh);if(st.cash>c*3){const [cost,g]=shoreRepair(sh);note('Shore technicians repaired '+sh.name+(sh.status==='voyage'?' during its port call':'')+'. Condition +'+g+'% for '+fm(cost)+'.','','tech')}}
  });
}
function autoCharter(note){
  if(!st.pol.autoCharter)return;
  st.ships.filter(sh=>sh.status==='idle'&&manned(sh)&&canTrade(sh)).forEach(sh=>{
    let best=null,bs=0;
    st.offers.filter(o=>o.cls===sh.cls&&!(o.hra&&!av('hra'))).forEach(o=>{const p=estProfit(o);if(p<=0)return;let s=p/o.months;if(st.pol.mode===0&&o.type==='VC')s*=1.15;if(st.pol.mode===2&&o.type==='TC')s*=1.25+o.months*0.01;if(s>bs){bs=s;best=o}});
    if(best){sh.status='voyage';sh.left=best.months;sh.c=best;st.offers=st.offers.filter(x=>x!==best);note('Chartering fixed '+sh.name+(best.type==='VC'?' '+best.from+' → '+best.to:' on a '+best.months+'-month time charter')+' for '+best.who+'.','','charter')}
    else note('Chartering found no profitable cargo for '+sh.name+' this month.','bad','charter');
  });
}

function tenderWin(sh,p,mult){
  if(!sh||sh.status!=='idle')return ['The vessel was no longer available.',''];
  if(Math.random()>p)return ['A rival owner won the tender.','bad'];
  const c=CLS[sh.cls],hire=r10k((earnBase(sh.cls)-c.fuel*2635-c.port)*st.idx.offshore*mult*(1+boostFor('offshore')));
  sh.status='voyage';sh.left=18;sh.c={type:'TC',months:18,hire,rev:hire*18,who:'East Coast Oil Operator',from:'Kemaman',to:'Terengganu oil fields',cargo:'Field support',hra:false};st.rep+=2;
  return ['Tender won. '+sh.name+' starts an 18-month charter at '+fm(hire)+' a month.','good'];
}
function rollEvent(){
  const ids=Object.keys(EVENTS).filter(id=>EVENTS[id].make&&EVENTS[id].elig(st).length>0);if(!ids.length)return;
  const id=pick(ids),x=pick(EVENTS[id].elig(st));
  if(['psc','pscCert','vetting','misconduct'].includes(id)&&Math.random()<eff('marine')*0.5){
    const sh=x.sh||x;if(sh&&sh.name){st.rep+=1;addLog('Marine Superintendent prepared '+sh.name+' well. Inspection passed with no deficiencies.','good','marine')}return;
  }
  const ev=EVENTS[id].make(x);
  st.queue.push({kind:'event',id,ship:ev.ship??null,extra:ev.extra||null,title:ev.title,body:ev.body});
}

/* ---------- crew ops ---------- */
function signOff(sh,r,note){
  const p=sh.crew[r];sh.crew[r]=null;if(av('comp'))spend('allow',3000);spend('recruit',3500);
  const back=Math.random()<st.morale/100*0.8+(av('comp')?0.2:0);
  if(back){p.ex=true;p.exAge=0;p.left=0;p.flag=false;p.comp=Math.min(98,p.comp+1);st.pool.push(p)}
  note(`${RANKS[r].t} ${p.name} signed off ${sh.name}${back?' and wants to rejoin later':''}.`,'','crew');
}
function sendHome(p){spend('recruit',5000);if(!p.flag&&Math.random()<st.morale/100){p.ex=true;p.exAge=0;p.left=0;st.pool.push(p)}}

/* ---------- office, HR and finance ---------- */
const lateChance=()=>0.07*(1.35-Math.min(1,eff('finance')))*[1.6,1,0.5][st.pol.credit]*(st.budget.finance===0?1.4:1);
function collectRecv(note){
  const s=st,fe=Math.min(1,eff('finance'));
  s.recv.forEach(r=>{r.age++;if(r.age<2)return;
    if(Math.random()<0.45+0.4*fe){earn('freight',r.amt);r.done=1;note(r.who+' finally paid '+fm(r.amt)+' for the '+r.ship+' voyage.','good','fin')}
    else if(r.age>=4){r.done=1;s.board-=3;note('Finance wrote off '+fm(r.amt)+' owed by '+r.who+'. The charterer went bust.','bad','fin')}});
  s.recv=s.recv.filter(r=>!r.done);
}
function officeMonth(note,mStart){
  const s=st,oc=officeCost();
  spend('office',oc.rent);spend('staff',oc.heads);spend('opay',oc.pay);spend('oben',oc.ben);DK().forEach(d=>spend('budget',deptBudget(d)));
  if(mStart%12===11&&ob('bonus')){const b=(staffCount()*oPay()+oc.heads)*ob('bonus');spend('obonus',b);note('Year-end bonus of '+ob('bonus')+' month'+(ob('bonus')>1?'s':'')+' paid to office staff and heads ('+fm(b)+').','good','hr')}
  const hrE=Math.min(1,eff('hr')),quit=[];
  DK().forEach(d=>{const n=s.staff[d];for(let i=0;i<n;i++){const p=clamp((70-s.omorale)/360,0.004,0.16)*(1.25-0.6*hrE)*(s.budget.hr===0?1.3:1);if(Math.random()<p){s.staff[d]--;quit.push(d)}}});
  if(quit.length){s.oLeft.push({m:mStart,n:quit.length});note(quit.length+' office staff resigned from '+[...new Set(quit)].map(d=>DNAME[d]).join(', ')+'. HR will try to refill the posts.','bad','hr')}
  s.oLeft=s.oLeft.filter(x=>x.m>mStart-12);
  if(s.omorale<40)DK().forEach(d=>{const h=s.heads[d];if(h&&Math.random()<0.06){s.heads[d]=null;note(h.name+', your '+DEPTS[d].t+', resigned because office morale is so low.','bad','hr')}});
  s.ramp={};let hired=0,missed=0;
  DK().forEach(d=>{let need=s.hc[d]-s.staff[d];while(need-->0){const ag=s.pol.hire===1;spend('recruit',ag?oPay():1500);let pr=ag?0.68+0.3*hrE:0.35+0.35*hrE;if(s.opay===0)pr*=0.7;if(s.budget.hr<=1)pr*=0.85;if(Math.random()<pr){s.staff[d]++;s.ramp[d]=(s.ramp[d]||0)+1;hired++}else missed++}});
  if(hired)note('HR hired '+hired+' new office staff. They need a month to settle in.','good','hr');
  if(missed)note('HR could not fill '+missed+' office vacanc'+(missed>1?'ies':'y')+' this month.','bad','hr');
  s.oShock*=0.7;s.omorale+=(oMoraleTarget()-s.omorale)*0.3;
}

/* ---------- turn ---------- */
function endMonth(){
  if(!st||st.over||st.queue.length)return;
  const s=st,notes=[],mStart=s.m;const note=(t,tone,cat)=>{notes.push({t,tone});addLog(t,tone,cat)};
  const te=eff('technical');
  s.orders.forEach(o=>{o.left--;if(o.left<=0){const bal=o.price-o.paid,pay=Math.min(Math.max(0,s.cash),bal);capOut(pay);const rest=bal-pay;if(rest>0)s.loan+=rest;
    const sh=newShip(o.cls,0,false,o.name);sh.cond=100;s.ships.push(sh);note(`Newbuilding ${sh.name} delivered${rest>0?'. Shipyard financing of '+fm(rest)+' added to your loan':''}.`,'good')}});
  s.orders=s.orders.filter(o=>o.left>0);
  s.ships.forEach(sh=>{
    sh._r=0;sh._c=0;const S=(cat,x)=>{spend(cat,x);sh._c+=x},E=(cat,x)=>{earn(cat,x);sh._r+=x};
    const c=CLS[sh.cls],atSea=sh.status==='voyage',cc=crewCost(sh.cls,shipBasic(sh),filled(sh).length+c.ratings,atSea,atSea&&sh.c&&sh.c.hra);
    S('wages',cc.wages);S('food',cc.food);S('allow',cc.allow);
    S('insur',c.other*0.35);S('stores',c.other*0.45*MAINT[s.maint].mult);S('mgmt',c.other*0.2);
    if(sh.status==='delivery'){sh.left--;if(sh.left<=0){sh.status='idle';note(sh.name+' delivered.','good')}return}
    if(sh.status==='dock'){sh.left--;if(sh.left<=0){sh.status='idle';sh.cond=96;note(sh.name+(sh.emDock?' left emergency dry dock':' passed its special survey')+'. Condition 96%, next dry dock '+dueLabel(sh)+'.','good','tech');sh.emDock=false}return}
    if(sh.status==='idle'){sh.cond=Math.max(30,sh.cond-0.6);return}
    const k=sh.c;let off=false;
    sh.cond=Math.max(20,sh.cond-(2+Math.random()*2.5)*MAINT[s.maint].decay*(1+sh.age/40)*(1.2-0.4*te));
    let p=(0.008+Math.max(0,65-sh.cond)*0.018)*crewMult(sh)*(1.4-0.8*te);if(s.hseq)p*=0.6;if(s.morale<40)p*=1.4;
    if(Math.random()<p){if(sh.cond<38&&!s.queue.some(q=>q.id==='bigBreak'&&q.ship===sh.id)){off=true;sh.left+=1;s.rep-=4;s.queue.push({kind:'event',id:'bigBreak',ship:sh.id,title:'Major breakdown on '+sh.name,body:`${sh.name} lost propulsion. The Chief Engineer reports a cracked cylinder liner and damage to the stern tube seal. Condition is ${Math.round(sh.cond)}%. Shore technicians alone cannot fix this properly.`})}else{const cost=r10k(rnd(6e5,1.4e6));S('repair',cost);sh.left+=1;s.rep-=4;off=true;note('Engine breakdown on '+sh.name+'. Repairs '+fm(cost)+', a month lost.','bad')}}
    if(k.type==='VC'){S('fuel',c.fuel*s.bunker*s.fuelEff);S('port',c.port)}
    else if(!off)E('hire',k.hire);else note(sh.name+' was off-hire, so no hire was paid.','bad');
    sh.left--;
    if(sh.left<=0){
      if(k.type==='VC'){sh._r+=k.rev;if(Math.random()<lateChance()){s.recv.push({id:s.nid++,amt:k.rev,who:k.who,ship:sh.name,age:0});note(sh.name+' arrived at '+k.to+'. '+k.who+' has not paid the freight of '+fm(k.rev)+' yet. Finance is chasing it.','bad','fin')}else{earn('freight',k.rev);note(sh.name+' arrived at '+k.to+'. Freight of '+fm(k.rev)+' received.','good')}
        if(isTank(sh.cls)&&av('tank'))S('allow',cc.heads*av('tank'));
        if(c.seg==='bulk'&&av('hold'))S('allow',cc.heads*av('hold'))}
      else note(sh.name+' finished its time charter with '+k.who+'.','good');
      s.rep+=1.5;sh.status='idle';sh.c=null;
    }
  });
  s.ships.forEach(sh=>{sh.lastNet=(sh._r||0)-(sh._c||0);sh.totR+=sh._r||0;sh.totC+=sh._c||0;delete sh._r;delete sh._c});
  collectRecv(note);
  s.ships.forEach(sh=>RK.forEach(r=>{const p=sh.crew[r];if(!p)return;p.left--;p.exp+=1/12;if(p.left<=0&&sh.status!=='voyage')signOff(sh,r,note)}));
  s.pool=s.pool.filter(p=>++p.exAge<=6);
  autoCrew(note);autoTrain();autoDock(note);
  if(mStart%12===2&&av('fest')){const b=s.ships.reduce((a,sh)=>a+shipBasic(sh),0)*0.5;spend('allow',b);note('Festive bonus of '+fm(b)+' paid to all crew.','good')}
  officeMonth(note,mStart);
  if(s.hseq)spend('hseq',190000);spend('interest',s.loan*effRate()/12);
  const lv=ltv();if(lv>0.65){if(!s.ltvPen)note('Bank warning: loan is '+Math.round(lv*100)+'% of fleet value, above the 65% covenant. A 1% penalty rate applies until you bring it down.','bad','fin');s.ltvPen=1;s.board-=2}else if(s.ltvPen&&lv<=0.6){s.ltvPen=0;note('Loan-to-value back under 60%. The bank removed the penalty rate.','good','fin')}
  s.ships.forEach(sh=>sh.age+=1/12);
  const mt=moraleTarget();s.morale+=(mt-s.morale)*0.25;s.empRep+=((mt*0.7+12+(s.hseq?5:0)+eff('crewing')*8)-s.empRep)*0.2;
  SEGS.forEach(k=>{s.idx[k]=clamp(s.idx[k]+gauss()*0.06+(1-s.idx[k])*0.08,0.6,1.6)});
  s.prevBunker=s.bunker;s.bunker=clamp(s.bunker*(1+gauss()*0.045)+(2680-s.bunker)*0.08,2000,4000);s.bunkerHist.push(s.bunker);s.bunkerHist=s.bunkerHist.slice(-24);
  s.scrap=clamp(s.scrap*(1+gauss()*0.04),1600,2500);
  const rev=sumObj(s.cur.rev),exp=sumObj(s.cur.exp);
  s.hist.push({m:mStart,rev,exp,net:rev-exp,revD:{...s.cur.rev},expD:{...s.cur.exp},cap:{...s.cur.cap}});s.hist=s.hist.slice(-48);s.cur=newLedger();
  s.m++;fix();
  if(s.cash<0){s.neg++;addLog(s.neg>=2?'Cash negative two months in a row.':'Negative cash! Take a loan or sell a ship before the end of next month.','bad')}else s.neg=0;
  genOffers();s.market.splice(0,2);while(s.market.length<5)s.market.push(genListing());refreshBids();if(s.m%3===0)s.headPool={};
  autoCharter(note);
  s.queue.unshift({kind:'report',rev,exp,notes,m:mStart});
  if(Math.random()<0.75)rollEvent();if(Math.random()<0.2)rollEvent();
  const t=tierIdx();if(t>s.tierMax){s.tierMax=t;s.board+=10;s.rep+=5;s.queue.push({kind:'tier',t});addLog(s.company+' is now a '+TIERS[t].n+'.','good')}
  fix();
  if(s.neg>=2)s.over={type:'fired',why:'The company ran out of cash two months in a row.'};
  else if(s.m%12===0)annualReview();
  else if(s.m%3===0)boardReview();
  if(s.over)s.queue.push({kind:'end'});
  confirmKey=null;save();render();
}
function boardReview(){
  const s=st,nw=netWorth(),prev=s.reviewNW,pct=(nw-prev)/Math.abs(prev)*100;let d,v;
  if(pct>=2.5){d=8;v='The board is very pleased with the company\'s growth.'}else if(pct>=0){d=3;v='The board is satisfied, but wants faster growth.'}
  else if(pct>-3){d=-5;v='The board is worried about the fall in company value.'}else{d=-12;v='The board is disappointed and wants a recovery plan.'}
  if(s.rep<35){d-=5;v+=' Low client reputation was raised.'}if(s.empRep<35){d-=3;v+=' Poor crewing standards were raised.'}
  s.board=clamp(s.board+d,0,100);s.reviewNW=nw;s.queue.push({kind:'board',prev,nw,pct,v,d,q:((s.m/3-1)%4)+1,y:yearOf(s.m-1)});
  if(s.board<20)s.over={type:'fired',why:'The board of directors lost confidence in your leadership.'};
}
function annualReview(){
  const s=st,nw=netWorth(),hit=nw>=s.target,y=yearOf(s.m-1),ytd=s.hist.filter(x=>yearOf(x.m)===y);
  const d=hit?12:(nw>=s.yearNW?-3:-10);s.board=clamp(s.board+d,0,100);
  const old=s.target;s.yearNW=nw;s.reviewNW=nw;s.target=Math.round(nw*1.08/1e6)*1e6;
  s.queue.push({kind:'annual',y,nw,old,hit,d,rev:ytd.reduce((a,x)=>a+x.rev,0),exp:ytd.reduce((a,x)=>a+x.exp,0),next:s.target});
  addLog('Annual meeting '+y+': target '+(hit?'achieved':'missed')+'. New target for '+(y+1)+': '+fm(s.target)+'.',hit?'good':'bad');
  if(s.board<20)s.over={type:'fired',why:'The board of directors lost confidence in your leadership.'};
}

/* ---------- actions ---------- */
function loanCap(){return Math.max(0,fleetValue()*0.5-st.loan)}
const loanStep=()=>Math.max(8e6,fleetValue()*0.1);
const nbPrice=cls=>r10k(CLS[cls].value*1.12*(0.9+0.1*st.idx[segOf(cls)]));
const inputVal=id=>{const el=document.getElementById(id);return el?el.value:''};
function act(a,v){
  if(a==='tab'){tab=v;confirmKey=null;showPool=null;renaming=null;nameMsg=null;render();window.scrollTo(0,0);return}
  if(a==='plan'){startPlan=v;render();return}
  if(a==='begin'){const n=(document.getElementById('co-name').value||'').trim()||'FX Shipping Sdn Bhd';fresh(n.slice(0,40),startPlan);tab='overview';render();return}
  if(!st)return;
  if(a==='end')return endMonth();
  if(a==='accept'){
    const o=st.offers.find(x=>x.id===+v),sel=document.getElementById('sel-'+v),sh=sel&&shipById(+sel.value);
    if(!o||!sh||sh.status!=='idle'||!manned(sh))return;
    if(o.hra&&!av('hra')){if(Math.random()<0.5){st.morale-=6;st.empRep-=4;addLog('Crew of '+sh.name+' refused to sail to '+o.to+' without a high risk area bonus.','bad');save();render();return}st.empRep-=3;st.morale-=4}
    sh.status='voyage';sh.left=o.months;sh.c=o;st.offers=st.offers.filter(x=>x!==o);
    addLog('You fixed '+sh.name+(o.type==='VC'?' '+o.from+' → '+o.to+' for '+o.who+'.':' on a '+o.months+'-month time charter to '+o.who+'.'),'','charter');
  }
  if(a==='dock'){const sh=shipById(+v);if(!sh||sh.status!=='idle')return;const plan=dueIn(sh)<=12;if(!plan&&sh.cond>=40)return;const c=plan?dockCost(sh):emDockCost(sh);if(st.cash<c)return;enterDock(sh,c,plan?1:2,!plan);addLog(sh.name+(plan?' entered dry dock for its special survey. Cost ':' sent for emergency dry dock. Cost ')+fm(c)+'.','','tech')}
  if(a==='shore'){const sh=shipById(+v);if(!sh||!canShore(sh))return;const c=shoreCost(sh);if(st.cash<c)return;const [cost,g]=shoreRepair(sh);addLog('Shore technicians repaired '+sh.name+'. Condition +'+g+'% for '+fm(cost)+'.','','tech')}
  if(a==='sell'){const key='sell'+v;if(confirmKey!==key){confirmKey=key;render();return}
    const sh=shipById(+v);if(!sh||sh.status!=='idle')return;const p=bidFor(sh);capIn(p);spend('commission',p*0.01);filled(sh).forEach(r=>sendHome(sh.crew[r]));st.ships=st.ships.filter(x=>x!==sh);addLog(sh.name+' sold for '+fm(p)+'.','')}
  if(a==='scrap'){const key='scrap'+v;if(confirmKey!==key){confirmKey=key;render();return}
    const sh=shipById(+v);if(!sh||sh.status!=='idle')return;const p=r10k(CLS[sh.cls].ldt*st.scrap);capIn(p);filled(sh).forEach(r=>sendHome(sh.crew[r]));st.ships=st.ships.filter(x=>x!==sh);addLog(sh.name+' sold for demolition at '+fm(p)+'.','')}
  if(a==='buy'){const m=st.market.find(x=>x.id===+v);if(!m||st.cash<m.price*1.01)return;const cn=checkName(inputVal('nm-m'+m.id));if(!cn.ok){nameMsg={k:'m'+m.id,t:cn.e};render();return}nameMsg=null;delete drafts['nm-m'+m.id];capOut(m.price);spend('commission',m.price*0.01);const sh=newShip(m.cls,m.age,false,cn.n);sh.cond=m.cond;sh.status='delivery';sh.left=1;st.ships.push(sh);st.market=st.market.filter(x=>x!==m);addLog('Bought '+sh.name+' ('+CLS[m.cls].nama+') for '+fm(m.price)+'. Crewing will man it on delivery.','good')}
  if(a==='order'){const price=nbPrice(v),dep=price*0.2;if(st.cash<dep)return;const cn=checkName(inputVal('nm-n'+v));if(!cn.ok){nameMsg={k:'n'+v,t:cn.e};render();return}nameMsg=null;delete drafts['nm-n'+v];capOut(dep);st.orders.push({id:st.nid++,cls:v,price,paid:dep,left:12,name:cn.n||null});addLog('Ordered '+(cn.n?cn.n+', a new ':'a new ')+CLS[v].nama+' for '+fm(price)+'. 20% deposit paid, delivery in 12 months.','good')}
  if(a==='renameStart'){renaming=+v;nameMsg=null;render();const el=document.getElementById('rn-'+v);if(el){el.focus();el.select()}return}
  if(a==='renameCancel'){renaming=null;nameMsg=null;render();return}
  if(a==='rename'){const sh=shipById(+v);if(!sh)return;const raw=inputVal('rn-'+v);if(raw.trim().toLowerCase()===sh.name.toLowerCase()){renaming=null;render();return}const cn=checkName(raw);if(!cn.ok||!cn.n){nameMsg={k:'r'+v,t:cn.e||'Type a name first.'};render();return}const old=sh.name;sh.name=cn.n;st.used.push(cn.n);renaming=null;nameMsg=null;addLog(old+' renamed '+cn.n+'. Flag registry fee RM 15k.','');spend('port',15000)}
  if(a==='ftab'){fleetTab=v;render();return}
  if(a==='budget'){const [d,l]=v.split(':');st.budget[d]=+l}
  if(a==='opay')st.opay=+v;
  if(a==='oben'){const [k,l]=v.split(':');st.oben[k]=+l}
  if(a==='dismiss'){const key='dis'+v;if(confirmKey!==key){confirmKey=key;render();return}const h=st.heads[v];if(!h)return;spend('sever',h.pay*3);st.heads[v]=null;st.oShock-=3;addLog(h.name+' was dismissed as '+DEPTS[v].t+'. Three months of pay given as notice and severance.','','hr')}
  if(a==='borrow'){const amt=Math.min(loanStep(),loanCap());if(amt<5e5)return;st.loan+=amt;st.cash+=amt;addLog('Bank loan of '+fm(amt)+' approved.','')}
  if(a==='repay'){const amt=Math.min(loanStep(),st.loan,Math.max(0,st.cash));if(amt<=0)return;st.loan-=amt;st.cash-=amt;addLog('Repaid '+fm(amt)+' of the loan.','')}
  if(a==='wage'){const [r,d]=v.split(':');const step=r==='rating'?250:1000;st.wages[r]=clamp(st.wages[r]+(+d)*step,r==='rating'?4000:15000,r==='rating'?14000:80000)}
  if(a==='allow'){const [k,l]=v.split(':');st.allow[k]=+l}
  if(a==='pol'){const [k,x]=v.split(':');st.pol[k]=+x}
  if(a==='maint')st.maint=+v;
  if(a==='hseq')st.hseq=v==='1';
  if(a==='staff'){const [d,x]=v.split(':');const nv=clamp(st.hc[d]+(+x),0,25);if(nv<st.staff[d]){const cut=st.staff[d]-nv;spend('sever',cut*oPay()*2);st.staff[d]=nv;st.oShock-=4*cut;addLog('Retrenched '+cut+' '+DNAME[d]+' staff. Two months of pay each as severance. Office morale dropped.','bad','hr')}st.hc[d]=nv}
  if(a==='pool'){showPool=showPool===v?null:v;render();return}
  if(a==='appoint'){const [d,i]=v.split(':');const h=headPool(d)[+i];if(!h)return;const old=st.heads[d];spend('recruit',30000);st.heads[d]=h;st.headPool[d]=st.headPool[d].filter(x=>x!==h);showPool=null;addLog('Appointed '+h.name+' as '+DEPTS[d].t+(old?', replacing '+old.name:'')+'.','good')}
  if(a==='opendiv'){const c=DIV[v].open;if(st.divs.includes(v)||st.cash<c)return;spend('setup',c);st.divs.push(v);for(let i=0;i<2;i++)st.market.unshift(genListing(v));addLog('Opened the '+SEG[v]+' division. Ships of this type are now on the market.','good')}
  if(a==='office'){const o=OFFICES[v];if(st.offices.includes(v)||st.cash<o.cost)return;spend('setup',o.cost);st.offices.push(v);addLog('Opened a branch office in '+o.n+'.','good')}
  if(a==='flag'){const p=findPerson(+v);if(p)p.flag=!p.flag}
  if(a==='train'){const [pid,cert]=v.split(':');const p=findPerson(+pid);if(!p||p.certs.includes(cert))return;spend('train',CERTS[cert][2]);p.certs.push(cert);addLog(p.name+' completed '+CERTS[cert][0]+'.','good','crew')}
  if(a==='reset'){if(confirmKey!=='reset'){confirmKey='reset';render();return}st=null;confirmKey=null;try{localStorage.removeItem(KEY)}catch(e){}render();return}
  if(a==='choose'){const q=st.queue[0],e=EVENTS[q.id],sh=q.ship!=null?shipById(q.ship):null;const [res,tone]=e.choices[+v][2](st,sh,q);q.result=res;q.tone=tone;fix();addLog(q.title+'. '+res,tone)}
  if(a==='next'){const q=st.queue.shift();if(q&&q.kind==='end')st.queue=[]}
  if(a==='again'){st=null;try{localStorage.removeItem(KEY)}catch(e){}tab='overview';render();return}
  if(!['sell','scrap','dismiss'].includes(a))confirmKey=null;
  save();render();
}

/* ---------- views ---------- */
function spark(vals,w,h){
  if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/r*(h-8)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const e=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}
function arrow(now,prev){const d=now-prev;if(Math.abs(d)<0.005*prev)return '<span class="muted">flat</span>';return `<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d/prev*100).toFixed(1)}%</span>`}
const kpi=(l,v,cls)=>`<div class="kpi"><small>${l}</small><b class="${cls||''}">${v}</b></div>`;
function condBar(label,v){const c=v>=70?'ok':v>=55?'mid':'low';return `<div class="cond ${c}"><div style="display:flex;justify-content:space-between"><span>${label}</span><b class="num">${Math.round(v)}</b></div><div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div></div>`}
function segRow(a,cur,labels){return `<div class="seg">${labels.map((l,i)=>`<button type="button" data-a="${a}" data-v="${i}" aria-pressed="${cur===i}">${l}</button>`).join('')}</div>`}
function polRow(k,labels){return `<div class="seg">${labels.map((l,i)=>`<button type="button" data-a="pol" data-v="${k}:${i}" aria-pressed="${st.pol[k]===i}">${l}</button>`).join('')}</div>`}
function memoLog(cat,n){const l=st.log.filter(x=>x.cat===cat).slice(0,n);return l.length?`<ul class="log">${l.map(x=>`<li><span class="m">${mlabel(x.m)}</span><span class="${x.tone}">${esc(x.t)}</span></li>`).join('')}</ul>`:'<p class="muted small" style="margin:0">Nothing yet. Activity appears after you end the month.</p>'}

const GA=['staff','opay','oben','obonus','budget','office','hseq','sever'],OPEXC=['wages','food','allow','insur','stores','mgmt'];
function mgmtNums(){
  const h=st.hist.slice(-3),L=st.hist[st.hist.length-1],sum=(x,c)=>c.reduce((a,k)=>a+(x.expD[k]||0),0);
  const n=st.ships.length,util=n?st.ships.filter(s=>s.status==='voyage').length/n:0;
  const opexDay=L&&n?sum(L,OPEXC)/n/30:0,ga=L?sum(L,GA):officeCostTotal();
  const rev3=h.reduce((a,x)=>a+x.rev,0),ga3=h.reduce((a,x)=>a+sum(x,GA),0),exp3=h.length?h.reduce((a,x)=>a+x.exp,0)/h.length:0;
  return {util,opexDay,ga,gaPct:rev3?ga3/rev3:null,ltv:ltv(),runway:exp3?st.cash/exp3:null};
}
function officeCostTotal(){const o=officeCost();return o.pay+o.ben+o.heads+o.budget+o.rent}
function memos(){
  const out=[],H=d=>st.heads[d]?st.heads[d].name:'Acting (post vacant)',add=(d,t,tone)=>out.push({d,t,tone});
  const idle=st.ships.filter(s=>s.status==='idle'&&manned(s)&&canTrade(s)).length;
  if(idle)add('chartering',idle+' ship'+(idle>1?'s are':' is')+' idle and ready. '+(st.pol.autoCharter?'I will fix them at month end if the numbers work.':'Auto-chartering is off, so please fix them in Contracts.'),'');
  if(st.budget.chartering<=1)add('chartering','With our budget cut, brokers are sending us fewer cargoes.','bad');
  const low=st.ships.filter(s=>s.cond<62&&s.status!=='dock').length;if(low)add('technical',low+' ship'+(low>1?'s are':' is')+' below 62% condition. Breakdowns become likely. I will send shore technicians.','bad');
  if(st.budget.technical<=1)add('technical','Spares stock is running low because of the budget. Ships are wearing faster.','bad');
  const vac=st.ships.reduce((a,s)=>a+RK.filter(r=>!s.crew[r]).length,0);if(vac)add('crewing',vac+' officer post'+(vac>1?'s are':' is')+' vacant. Ships cannot sail without full officers.','bad');
  if(wageRatio()<0.95)add('crewing','Our wage scale is '+Math.round(wageRatio()*100)+'% of market. Good officers are choosing other owners.','bad');
  const lv=ltv();if(lv>0.55)add('finance','Loan is '+Math.round(lv*100)+'% of fleet value. The bank covenant is 65%. We should not borrow more.',lv>0.65?'bad':'');
  const mn=mgmtNums();if(mn.runway!=null&&mn.runway<2.5&&st.m>0)add('finance','Cash covers only '+mn.runway.toFixed(1)+' months of spending. We need a buffer.','bad');
  const rv=recvSum();if(rv)add('finance','Clients still owe us '+fm(rv)+'. We are chasing it.','');
  if(st.omorale<50)add('hr','Office morale is '+Math.round(st.omorale)+'. '+st.oLeft.reduce((a,x)=>a+x.n,0)+' staff left in the last year. Check pay and benefits.','bad');
  OPS.forEach(d=>{const c=coverage(d);if(st.ships.length&&c<0.7)add('hr',DNAME[d]+' is overloaded, covering only '+Math.round(c*100)+'% of the fleet. Approve more headcount.','bad')});
  if(!st.hseq&&st.rep<45)add('marine','Client reputation is low. An HSEQ programme would cut incidents and PSC findings.','');
  return out.slice(0,6).map(m=>({...m,who:H(m.d)}));
}

    ${nx?`<p class="muted small" style="margin:14px 0 0">Next level, <b style="color:var(--ink)">${nx.n}</b>: ${nx.ships} ships (now ${st.ships.length+st.orders.length}), ${nx.divs} divisions (now ${st.divs.length}), net worth ${fm(nx.nw)}.</p>`:'<p class="up small" style="margin:14px 0 0"><b>You have reached the top level.</b></p>'}
  </section>

function statusPill(sh){
  if(tooOld(sh)&&sh.status==='idle')return '<span class="pill p-dock">Too old to trade</span>';
  if(surveyOverdue(sh)&&sh.status==='idle')return '<span class="pill p-dock">Survey due</span>';
  if(sh.status==='idle')return manned(sh)?'<span class="pill p-idle">Idle</span>':'<span class="pill p-dock">Undermanned</span>';
  if(sh.status==='voyage')return `<span class="pill p-voy">${sh.c.type==='TC'?'On charter':'At sea'} · ${sh.left} mo</span>`;
  if(sh.status==='dock')return `<span class="pill p-dock">${sh.emDock?'Emergency dock':'Dry dock'} · ${sh.left} mo</span>`;
  return '<span class="pill p-del">Delivery</span>';
}
function nameInput(id,ph,k){return `<div class="namebox"><label for="${id}">Ship name</label><input id="${id}" maxlength="30" placeholder="${esc(ph)}" value="${esc(drafts[id]||'')}" autocomplete="off" data-enter="${k}">${nameMsg&&nameMsg.k===k.split('|')[1]?`<div class="err">${esc(nameMsg.t)}</div>`:''}</div>`}
function fleetSummary(ships,label){

function chart12(){
  const h=st.hist.slice(-12);if(!h.length)return '<p class="muted">The chart appears after your first month.</p>';
  const W=Math.max(320,h.length*48),H=170,pad=34,mx=Math.max(...h.map(x=>Math.max(x.rev,x.exp)))||1,bw=(W-pad)/h.length;
  const y=v=>H-22-(v/mx)*(H-40);
  let g='';for(let i=0;i<=2;i++){const v=mx*i/2,yy=y(v);g+=`<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad-4}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${(v/1e6).toFixed(0)}M</text>`}
  h.forEach((x,i)=>{const x0=pad+i*bw+bw*0.15,w=bw*0.33;g+=`<rect x="${x0}" y="${y(x.rev)}" width="${w}" height="${H-22-y(x.rev)}" rx="2" fill="var(--accent)"/><rect x="${x0+w+2}" y="${y(x.exp)}" width="${w}" height="${H-22-y(x.exp)}" rx="2" fill="var(--muted)" opacity=".55"/><text x="${x0+w}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${MONTHS[x.m%12]}</text>`});
  return `<div class="chart-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenditure by month">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>Revenue</span><span><i style="background:var(--muted);opacity:.55"></i>Expenditure</span></div>`;
}

  let bd='';if(L){const items=Object.entries(L.expD).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const mx=items.length?items[0][1]:1;

  <h2>Glossary</h2>
  <section class="card"><dl class="gloss">
    <dt>Marine Supt</dt><dd>Marine Superintendent. Usually a former Master. Looks after safety, PSC and vetting readiness, and officer performance.</dd>
    <dt>Technical Supt</dt><dd>Technical Superintendent. Usually a former Chief Engineer. Looks after maintenance, repairs and dry docks.</dd>
    <dt>STCW</dt><dd>IMO convention on training and certification of seafarers. Codes like A-VI/1 refer to its sections.</dd>
    <dt>CoC</dt><dd>Certificate of Competency. Class 1 for Master and Chief Engineer, Class 2 for Chief Officer and 2nd Engineer.</dd>
    <dt>SIRE</dt><dd>Oil majors' ship inspection scheme. Tankers and gas carriers need clean vetting to get good charters.</dd>
    <dt>DP</dt><dd>Dynamic positioning. Keeps offshore vessels in place by computer. Officers need a Nautical Institute DP certificate.</dd>
    <dt>MLC 2006</dt><dd>Maritime Labour Convention, covering wages, food, rest hours and repatriation.</dd>
    <dt>IBF</dt><dd>International Bargaining Forum. Sets crew rights in high-risk areas, including bonus pay.</dd>
    <dt>TEU / DWT / cbm</dt><dd>Container capacity / cargo weight / gas tank volume.</dd>
    <dt>AHTS / PSV</dt><dd>Anchor handling tug supply vessel / platform supply vessel, used in offshore oil and gas.</dd>
    <dt>PSC</dt><dd>Port State Control, inspection of foreign ships by port authorities.</dd>
    <dt>Off-hire</dt><dd>The ship cannot perform, so the charterer stops paying hire.</dd>
    <dt>Special survey</dt><dd>Class society inspection every 5 years. The ship must go into dry dock so the hull, propeller and tanks can be checked.</dd>
    <dt>Shore repair</dt><dd>Repairs done by technicians from shore while the ship is alongside or at anchor, without going into a dry dock.</dd>
    <dt>LDT</dt><dd>Lightweight tonnage, the weight of the empty ship. Used to price demolition.</dd>
  </dl></section>
  <div><button type="button" class="btn ${confirmKey==='reset'?'danger':''}" data-a="reset">${confirmKey==='reset'?'Tap again to start over':'Start a new game'}</button></div>`;

    h=`<div class="eyebrow">${q.id==='premium'?'Memo from Crewing':'CEO decision needed'}</div><h3>${esc(q.title)}</h3><p>${esc(q.body)}</p>`+(q.result?`<div class="result ${q.tone==='bad'?'down':q.tone==='good'?'up':''}">${esc(q.result)}</div><button type="button" class="btn primary" data-a="next">Continue</button>`

  else if(q.kind==='board'){
    h=`<div class="eyebrow">Board meeting · Q${q.q} ${q.y}</div><h3>${esc(q.v)}</h3>
    <div class="pl" style="margin-bottom:14px"><div><span>Net worth last quarter</span><span class="num">${fm(q.prev)}</span></div><div><span>Net worth now</span><b class="num">${fm(q.nw)}</b></div><div><span>Change</span><span class="num ${q.pct<0?'down':'up'}">${q.pct>=0?'+':''}${q.pct.toFixed(1)}%</span></div><div><span>Year target</span><span class="num">${fm(st.target)}</span></div><div class="tot"><span>Board confidence</span><span class="num">${Math.round(st.board)}/100 (${q.d>=0?'+':''}${q.d})</span></div></div>
    ${st.board<35&&!st.over?'<p class="down">If board confidence falls below 20, you will be fired.</p>':''}<button type="button" class="btn primary" data-a="next">Continue</button>`}
  else if(q.kind==='annual'){
    h=`<div class="eyebrow">Annual general meeting · ${q.y}</div><h3>${q.hit?'Target achieved':'Target missed'}</h3>
    <div class="pl" style="margin-bottom:14px"><div><span>Revenue ${q.y}</span><b class="num up">${fm(q.rev)}</b></div><div><span>Expenditure ${q.y}</span><span class="num">-${fm(q.exp)}</span></div><div><span>Net worth</span><b class="num">${fm(q.nw)}</b></div><div><span>Target</span><span class="num">${fm(q.old)}</span></div><div><span>Board confidence</span><span class="num">${Math.round(st.board)}/100 (${q.d>=0?'+':''}${q.d})</span></div><div class="tot"><span>New target for ${q.y+1}</span><span class="num">${fm(q.next)}</span></div></div>
    <button type="button" class="btn primary" data-a="next">Continue</button>`}
  else if(q.kind==='tier'){
    h=`<div class="eyebrow">Milestone reached</div><h3>${esc(st.company)} is now a ${TIERS[q.t].n}</h3><p>The board and your clients have noticed. Board confidence +10 and client reputation +5.</p>${TIERS[q.t+1]?`<p class="muted">Next level, ${TIERS[q.t+1].n}: ${TIERS[q.t+1].ships} ships, ${TIERS[q.t+1].divs} divisions and net worth ${fm(TIERS[q.t+1].nw)}.</p>`:''}<button type="button" class="btn primary" data-a="next">Continue</button>`}
  else if(q.kind==='end'){const nw=netWorth();
    h=`<div class="eyebrow">Game over</div><h3>You're fired</h3><p>${esc(st.over.why)} The board has appointed a new CEO.</p>
    <div class="pl" style="margin-bottom:14px"><div><span>Months as CEO</span><b class="num">${st.m}</b></div><div><span>Highest level</span><span>${TIERS[st.tierMax].n}</span></div><div><span>Final net worth</span><b class="num">${fm(nw)}</b></div><div><span>Started with</span><span class="num">${fm(st.startNW)}</span></div><div><span>Fleet size</span><span class="num">${st.ships.length} ships</span></div></div>
    <button type="button" class="btn primary" data-a="again">Play again</button>`}
  el.hidden=false;el.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;
}

function save(){try{if(st)localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){try{let s=localStorage.getItem(KEY);if(!s)s=localStorage.getItem(OLDKEY);const o=s?JSON.parse(s):null;return o&&(o.v===3||o.v===4)?o:null}catch(e){return null}}
function adopt(o){st=o;const wasV3=st.v===3;upgrade(st);if(wasV3){DK().forEach(d=>{if(st.heads[d]===undefined)st.heads[d]=genHead(d,3)});st.omorale=oMoraleTarget();addLog('New departments added: Finance and HR & Admin. Office staff are now managed in HR & Office.','')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;act(b.dataset.a,b.dataset.v)});
document.addEventListener('input',e=>{const t=e.target;if(t.id&&(t.id.startsWith('nm-')||t.id==='co-name'))drafts[t.id]=t.value});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter'||!t.dataset||!t.dataset.enter)return;e.preventDefault();const [a,,v]=t.dataset.enter.split('|');act(a,v)});
function start(data){const d=data&&data.st&&(data.st.v===3||data.st.v===4)?data.st:null;const o=d||load();if(o)adopt(o);else st=null;if(data&&data.tab)tab=data.tab;if(data&&data.fleetTab)fleetTab=data.fleetTab;render()}
window.claude?.hot?.snapshot?.(()=>({st,tab,fleetTab}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
