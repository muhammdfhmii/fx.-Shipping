<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4AA8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FX Shipping">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>FX Shipping</title>
<style>
/* Blue and white: navy-blue bar, white cards, blue accents; red/green kept only for money and warnings */
:root{
  --bg:#F1F5FB; --surface:#FFFFFF; --ink:#0E1E33; --muted:#5B6B82; --line:#D7E1EE;
  --accent:#1A5FD0; --accent-ink:#FFFFFF; --soft:#E5EEFB;
  --hdr:#0F4AA8; --hdr-ink:#FFFFFF; --hdr-muted:#BFD1EE;
  --good:#24764A; --good-soft:#E6F1EA; --warn:#7A5B00; --warn-soft:#F3EEDD; --bad:#B8322A; --bad-soft:#F7E6E4;
  --sea:#EEF4FC; --land:#FFFFFF; --coast:#9AB0CC; --grid:#E2EBF6;
  --shade:rgba(0,0,0,.5);
  --f-display:"Space Grotesk","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424; --surface:#111E33; --ink:#EAF1FB; --muted:#93A6C2; --line:#22344F;
  --accent:#5B9BFF; --accent-ink:#0A1424; --soft:#1A2B47;
  --hdr:#0B2A5E; --hdr-ink:#FFFFFF; --hdr-muted:#9FB6DA;
  --good:#5CC58C; --good-soft:#14281D; --warn:#D9B44A; --warn-soft:#2D260F; --bad:#F07A6E; --bad-soft:#331816;
  --sea:#0D1A2E; --land:#1C2C45; --coast:#3F5A80; --grid:#13223A;
  --shade:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424; --surface:#111E33; --ink:#EAF1FB; --muted:#93A6C2; --line:#22344F;
  --accent:#5B9BFF; --accent-ink:#0A1424; --soft:#1A2B47;
  --hdr:#0B2A5E; --hdr-ink:#FFFFFF; --hdr-muted:#9FB6DA;
  --good:#5CC58C; --good-soft:#14281D; --warn:#D9B44A; --warn-soft:#2D260F; --bad:#F07A6E; --bad-soft:#331816;
  --sea:#0D1A2E; --land:#1C2C45; --coast:#3F5A80; --grid:#13223A;
  --shade:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hdr);color:var(--hdr-ink)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.co{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font-size:12.5px;color:var(--hdr-muted)}
.cashpill{text-align:right}
.cashpill small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--hdr-muted)}
.cashpill b{font-family:var(--f-num);font-size:16px}
.cashpill b.neg{color:#FF9B90}
.btn-end{background:#FFFFFF;color:#0F4AA8;border:0;border-radius:999px;padding:9px 16px;font-weight:700;white-space:nowrap}
.btn-end:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:rgba(255,255,255,.12);border:0;color:var(--hdr-ink);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:#FFFFFF;color:#0F4AA8}
.tipbtn{background:none;border:1px solid rgba(255,255,255,.45);color:var(--hdr-ink);border-radius:999px;width:30px;height:30px;font-size:14px;font-weight:700;flex:none}
.tipbtn[aria-pressed="true"]{background:#FFFFFF;color:#0F4AA8;border-color:#FFFFFF}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(15,74,168,.08)}
.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bnav button{background:none;border:0;padding:8px 2px 9px;display:grid;justify-items:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--accent)}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.bnav .dot{position:absolute;top:5px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-weight:700}
body.notips .tip{display:none!important}

main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
h2{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);margin:10px 0 -6px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* kpis */
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.goal-top .big{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.kpi small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--f-num);font-size:17px;font-weight:600}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}

/* market */
.mkt{display:grid;gap:12px}
.bunker{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bunker .price{font-family:var(--f-num);font-size:24px;font-weight:600}
.idx-row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.idx-track{height:6px;background:var(--soft);border-radius:99px;position:relative}
.idx-track i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.idx-track u{position:absolute;left:37.5%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.6}
.up{color:var(--good)} .down{color:var(--bad)}

/* p&l */
.pl{display:grid;gap:6px;font-size:14px}
.pl div{display:flex;justify-content:space-between;gap:12px}
.pl .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700}

/* log */
.log{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:66px 1fr;gap:10px;font-size:14px}
.log .m{font-family:var(--f-num);font-size:12px;color:var(--muted);padding-top:2px}
.log .bad{color:var(--bad)} .log .good{color:var(--good)}

/* ships */
.ships,.offers{display:grid;gap:12px}
.ship-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ship-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.p-idle{background:var(--soft);color:var(--accent)}
.p-voy{background:var(--good-soft);color:var(--good)}
.p-dock{background:var(--warn-soft);color:var(--warn)}
.p-del{background:var(--soft);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;color:var(--muted);margin-top:4px}
.facts b{color:var(--ink);font-weight:600}
.cond{margin-top:12px;font-size:13px}
.cond .bar{height:7px;margin-top:6px}
.cond.ok .bar>i{background:var(--good)} .cond.mid .bar>i{background:var(--warn)} .cond.low .bar>i{background:var(--bad)}
.voyage{margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}

/* offers */
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--soft);border:1px solid transparent;padding:2px 7px;border-radius:3px}
.route{font-family:var(--f-display);font-weight:700;font-size:18px;margin-top:8px;line-height:1.25}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.money div{background:var(--bg);border-radius:10px;padding:8px 10px}
.money small{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
.money b{font-family:var(--f-num);font-size:14.5px}
@media (max-width:420px){.money{grid-template-columns:1fr 1fr}}
.assign{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.assign select{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px}
.help{background:var(--surface);border:1px dashed var(--coast);border-radius:8px;padding:14px 16px;font-size:14px}
.help b{color:var(--ink)}

/* manage */
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-top:10px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.setting+.setting{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.setting h3,.card h3{font-family:var(--f-display);font-size:17px;margin:0}
.dept{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.dept li{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:14px}
.dept b{font-weight:700}
dl.gloss{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:14px}
dl.gloss dt{font-weight:700} dl.gloss dd{margin:0;color:var(--muted)}
@media (max-width:460px){.dept li,dl.gloss{grid-template-columns:1fr}.dept li{gap:0}dl.gloss dd{margin-bottom:6px}}

/* fleet tabs, naming, memos */
.memo li.q-bad{border-left-color:var(--bad)}.memo li.q-good{border-left-color:var(--good)}
.cond.fat .bar>i{background:var(--accent)}.cond.fat.ok .bar>i{background:var(--bad)}.cond.fat.mid .bar>i{background:var(--warn)}.cond.fat.low .bar>i{background:var(--accent)}
main>*{min-width:0}
.wage-row+.setting{border-top:1px solid var(--line);margin-top:16px;padding-top:16px}
.subtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.subtabs button span{font-family:var(--f-num);font-size:12px;margin-left:4px;opacity:.8}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.namebox{margin-top:12px;display:grid;gap:6px}
.namebox label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.namebox input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-weight:600;min-width:0}
.namebox input:focus{border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.memo{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.memo li{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:14px}
.seg5{flex-wrap:wrap}.seg5 button{flex:1 1 30%;font-size:13px}
.seg button small{font-weight:500;opacity:.85}
.hbar-list{display:grid;gap:4px}

/* start */
.start{padding-block:32px 48px;display:grid;gap:18px}
.hero{background:var(--hdr);color:#FFFFFF;border-radius:10px;padding:26px 22px;position:relative;overflow:hidden}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
.hero p{margin:0;color:#D6E2F5;max-width:52ch}
.hero svg{position:absolute;right:-10px;bottom:-6px;width:220px;opacity:.18}
label.field{display:grid;gap:6px;font-weight:600}
label.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:500}
.plans{display:grid;gap:10px}
.plan{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.plan[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.plan b{font-family:var(--f-display);font-size:17px;display:block}
.plan span{font-size:14px;color:var(--muted)}

/* modal */
#modal{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:600px){#modal{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sheet h3{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.15;margin:6px 0 10px;text-wrap:balance}
.sheet p{margin:0 0 12px}
.choices{display:grid;gap:10px;margin-top:6px}
.choice{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px}
.choice:hover{border-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:13.5px;color:var(--muted)}
.result{background:var(--soft);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.sheet .btn.primary{width:100%;padding:12px}
.notes{margin:0 0 14px;padding-left:18px;font-size:14px;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}

/* crewing, payroll, finance */
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--accent);margin-right:4px}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)}
.kpis.k3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.kpis.k3{grid-template-columns:repeat(2,1fr)}}
.certs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.cert{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--good-soft);color:var(--good);border:0}
.cert.miss{background:var(--bad-soft);color:var(--bad)}
.cert.tank{background:var(--soft);color:var(--accent)}
button.cert{cursor:pointer} button.cert:hover{outline:1px solid var(--bad)}
.crew-row{padding-block:12px;border-top:1px solid var(--line)}
.crew-row:first-of-type{border-top:0}
.rk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crew-row .who{font-weight:700;font-size:15.5px}
.score{text-align:right;white-space:nowrap}
.score b{font-family:var(--f-num);font-size:22px}
.score small{display:block;font-size:11px;color:var(--muted)}
.remark{margin:10px 0 0;font-style:italic}
.wage-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.wage-row:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;line-height:1}
.stepper button:hover{border-color:var(--accent);color:var(--accent)}
.stepper b{font-family:var(--f-num);min-width:92px;text-align:center}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 10px;font-size:13.5px;align-items:center}
.hbar .t{height:6px;background:var(--soft);border-radius:99px;grid-column:1/-1;margin-bottom:6px}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hbar .v{text-align:right;font-family:var(--f-num)}
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filters{display:grid;gap:10px}
.filters .seg{margin-top:0}
.stars{color:var(--accent);font-size:16px;letter-spacing:1px;white-space:nowrap}
.stars .off{color:var(--line)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.opt{position:relative;text-align:left;display:grid;gap:3px;align-content:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
.opt b{font-size:14.5px;padding-right:24px;line-height:1.3}
.opt span{font-size:12.5px;color:var(--muted);line-height:1.4}
.opt em{font-style:normal;font-family:var(--f-num);font-size:12.5px;font-weight:600;color:var(--accent);margin-top:4px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt::after{content:"";position:absolute;top:11px;right:11px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]::after{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--soft)}
.opt:disabled{opacity:.45;cursor:default}
.loa-read{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px}
.loa-read b{font-family:var(--f-display);font-size:30px;font-weight:800}
input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--accent)}
.range-ends{display:flex;justify-content:space-between;gap:8px}
#designer{scroll-margin-top:120px}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
svg.map{display:block;width:100%;height:auto;max-height:68vh;background:var(--sea);touch-action:manipulation}
.map .sea{fill:var(--sea)}.map .land{fill:var(--land);stroke:var(--coast);stroke-width:.8;stroke-linejoin:round}
.map .grid line{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.map .rt{fill:none;stroke:var(--muted);stroke-width:1.1;stroke-dasharray:3 4;opacity:.55}.map .rt.on{stroke:var(--ink);stroke-width:2;opacity:1;stroke-dasharray:none}
.map .port circle{fill:var(--surface);stroke:var(--coast);stroke-width:1;vector-effect:non-scaling-stroke}.map .port text{fill:var(--muted);font-family:var(--f-body);font-weight:500;paint-order:stroke;stroke:var(--sea);stroke-width:calc(var(--hz)*1px);stroke-linejoin:round}
.map .shipm{cursor:pointer}.map .sl{fill:var(--ink);font-family:var(--f-display);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-width:calc(var(--hz)*1px);stroke-linejoin:round}
.map .m-sea{fill:var(--ink);stroke:var(--sea);stroke-width:1}.map .m-tc{fill:var(--ink);stroke:var(--sea);stroke-width:1.5}
.map .m-idle{fill:var(--surface);stroke:var(--ink);stroke-width:2}.map .m-dock{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.map .ring{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 2}
.map .yardm path{fill:var(--surface);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:2 1.5}.map .yardm text{fill:var(--muted);font-family:var(--f-body);font-style:italic;paint-order:stroke;stroke:var(--sea);stroke-width:calc(var(--hz)*1px)}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.mk{display:inline-block;width:11px;height:11px;margin-right:6px;vertical-align:-1px;flex:none}
.mk-sea{background:var(--ink);clip-path:polygon(0 0,100% 50%,0 100%,30% 50%)}.mk-tc{background:var(--ink);border-radius:50%}.mk-idle{border:2px solid var(--ink);border-radius:50%}.mk-dock{border:2px solid var(--ink)}.mk-yard{border:1.5px dashed var(--ink);transform:rotate(45deg) scale(.8)}
.maplist{display:grid}
.mrow{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px}
.mrow:first-child{border-top:0}.mrow.on{background:var(--soft);margin:0 -8px;padding-inline:10px;border-radius:6px}
.mrow .mn{flex:1;min-width:0;display:grid}.mrow .mn small{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.jr-row:first-child{border-top:0}
.fatw{display:flex;align-items:center;gap:6px;flex:none}.fatw small{font-size:12px;color:var(--muted);min-width:20px;text-align:right}
.fatm{display:inline-block;width:52px;height:5px;background:var(--soft);border-radius:9px;overflow:hidden}.fatm i{display:block;height:100%;background:var(--ink)}

/* ship type identity: blue family per division, silhouette + code per type */
:root{--t-container:#1E5BB8;--t-bulk:#4A6A90;--t-tanker:#0B2F6B;--t-bunker:#2486D2;--t-gas:#3D4DB3;--t-lng:#147894;--t-offshore:#5A82C4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--t-container:#76A8F2;--t-bulk:#9DB5D2;--t-tanker:#8DB2FF;--t-bunker:#7CC6FF;--t-gas:#A2ACF4;--t-lng:#66C6DE;--t-offshore:#AFC8F0}}
:root[data-theme="dark"]{--t-container:#76A8F2;--t-bulk:#9DB5D2;--t-tanker:#8DB2FF;--t-bunker:#7CC6FF;--t-gas:#A2ACF4;--t-lng:#66C6DE;--t-offshore:#AFC8F0}
.tbadge{display:inline-flex;align-items:center;gap:6px;color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent);border:1px solid color-mix(in srgb,var(--tc) 40%,transparent);border-radius:6px;padding:2px 8px 2px 6px;font-size:11.5px;font-weight:700;letter-spacing:.05em;white-space:nowrap;line-height:1.5;vertical-align:middle}
.tbadge svg{width:30px;height:12px;flex:none}
.card.typed{border-left:4px solid var(--tc)}
.typeh{display:flex;align-items:center;gap:10px;margin:10px 0 -6px}
.typeh .tn{font-family:var(--f-display);font-weight:700;font-size:15px}
.typeh::after{content:"";flex:1;height:1px;background:var(--line)}
.mon{display:grid;gap:0}
.mon-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 4px 11px 10px;border-left:4px solid var(--tc)}
.mon-row:first-child{border-top:0}
.mon-row[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 9%,transparent)}
.mon-row .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mon-row .st{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.mon-row .st b{color:var(--ink);font-weight:600}
.mon-row .pf{font-family:var(--f-num);font-size:13.5px;text-align:right}
.attn{color:var(--bad)!important}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl .seg{margin-top:0;flex:1;min-width:220px}
.mini{display:grid;gap:0}
.mini-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line);padding:11px 12px;border-left:4px solid var(--tc)}
.mini-row:first-child{border-top:0}
.mini-row .who{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-row .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.mini-row .rt{text-align:right;font-family:var(--f-num);font-size:13px}
.minicard{padding:0;overflow:hidden}
.selbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600}
.selbtn i{width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;display:inline-block;position:relative}
.selbtn[aria-pressed="true"]{border-color:var(--t-container);color:var(--t-container)}
.selbtn[aria-pressed="true"] i{border-color:var(--t-container);background:var(--t-container)}
.selbtn[aria-pressed="true"] i::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.card.picked{outline:2px solid var(--t-container);outline-offset:-1px}
.bulkbar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:4;background:var(--hdr);color:var(--hdr-ink);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bulkbar .bt{flex:1;min-width:150px}
.bulkbar small{display:block;color:var(--hdr-muted);font-size:12px}
.bulkbar b{font-family:var(--f-num)}
.bulkbar .btn{background:transparent;color:var(--hdr-ink);border-color:var(--hdr-muted)}
.bulkbar .btn.primary{background:#FFFFFF;color:#000;border-color:#FFFFFF}
.bulkbar .btn.danger{background:#FFFFFF;color:var(--bad);border-color:#FFFFFF}
.bo-grid{display:grid;gap:12px;margin-top:12px}
.bo-grid label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.bo-grid select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600}
.qrow{display:flex;justify-content:space-between;gap:10px;padding-block:9px;border-top:1px solid var(--line);font-size:14px}
.qrow:first-child{border-top:0}
.warnbox{margin-top:12px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:600}
/* meeting and nationality */
.dlg{display:grid;gap:8px;margin-top:12px}
.say{background:var(--bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:14px;max-width:92%}
.say .who{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.say.alt{margin-left:8%;border-radius:14px 4px 14px 14px;background:var(--surface)}
.say.me{border-color:var(--ink)}
.eyebrow-m{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.natchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.natchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted)}
.natchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>

/* ---------- department automation ---------- */
function place(sh,r,p,note){
  const cur=sh.crew[r];if(cur)sendHome(cur);
  spend('recruit',p.ex?3500:7500);p.seen=p.seen||p.ex;p.ex=false;p.flag=false;p.left=CONTRACT[st.pol.contract??1];p.onb=0;p.fat=Math.round(rnd(0,12));sh.crew[r]=p;st.pool=st.pool.filter(x=>x!==p);
  if(st.pol.autoTrain)gapsOf(p,sh.cls).forEach(c=>{spend('train',CERTS[c][2]);p.certs.push(c)});
  note&&note(`Crewing hired ${p.name} as ${RANKS[r].t} on ${sh.name}${cur?', replacing '+cur.name:''}.`,'good');
}
function autoCrew(note){
  const ce=eff('crewing'),mean=36+st.empRep*0.3+ce*24;
  st.ships.forEach(sh=>RK.forEach(r=>{
    const cur=sh.crew[r];if(cur&&!cur.flag)return;if(!cur&&isHeld(sh,r))return;
    const seg=cseg(sh.cls),nc=clamp(Math.round(natList(r).reduce((a,k)=>a+NAT[k].av,0)/3),1,5);let cands=Array.from({length:nc},()=>genSeafarer(r,{mean,seg,boost:ce*0.15,sh})).concat(st.pool.filter(p=>p.rank===r&&natList(r).includes(p.nat)));
    cands=cands.filter(p=>p.rep>=MINREP[st.pol.minRep]);
    if(st.pol.needStcw&&!st.pol.autoTrain)cands=cands.filter(p=>!gapsOf(p,sh.cls).length);
    if(cur)cands=cands.filter(p=>p.comp>cur.comp+4);
    cands.sort((a,b)=>b.comp-a.comp);
    const cap=st.wages[r]*(1+PREM[st.pol.premium]);let over=null;
    for(const p of cands){
      if(p.expect<=cap){const offer=Math.max(st.wages[r],p.expect);if(Math.random()<acceptChance(p,offer)){p.wage=offer;place(sh,r,p,(t,tn)=>note(t,tn,'crew'));return}}
      else if(!over)over=p;
    }
    if(cur){cur.flag=false;note(`Crewing found no better ${RANKS[r].t} than ${cur.name} this month.`,'','crew');return}
    if(over&&!st.queue.some(q=>q.id==='premium'&&q.ship===sh.id&&q.extra&&q.extra.r===r))st.queue.push({kind:'event',id:'premium',ship:sh.id,extra:{r,p:over},title:'Crewing Manager requests approval',
      body:`${sh.name} has no ${RANKS[r].t}. The best candidate, ${over.name} (${over.nat}, competence ${over.comp}, reputation ${over.rep.toFixed(1)}), asks for ${full(over.expect)} a month. Your scale is ${full(st.wages[r])} and your policy allows up to ${full(cap)}.`});
    else note(`Crewing could not find a ${RANKS[r].t} for ${sh.name}. The ship cannot sail until one is found.`,'bad','crew');
  }));
}
function autoTrain(){if(!st.pol.autoTrain)return;st.ships.forEach(sh=>filled(sh).forEach(r=>{const p=sh.crew[r];gapsOf(p,sh.cls).forEach(c=>{spend('train',CERTS[c][2]);p.certs.push(c)})}))}
function autoDock(note){
  const t=DOCKAT[st.pol.dockAt];
  st.ships.forEach(sh=>{
    if(st.pol.autoDock&&sh.status==='idle'&&dueIn(sh)<=3&&!tooOld(sh)){const c=dockCost(sh);if(st.cash>c*1.5){enterDock(sh,c,1);note('Technical booked '+sh.name+' into dry dock for its 5-year special survey ('+fm(c)+').','','tech')}else note(sh.name+' is due for its special survey but cash is too low to dry dock.','bad','tech')}
    else if(t&&canShore(sh)&&sh.cond<t){const c=shoreCost(sh);if(st.cash>c*3){const [cost,g]=shoreRepair(sh);note('Shore technicians repaired '+sh.name+(sh.status==='voyage'?' during its port call':'')+'. Condition +'+g+'% for '+fm(cost)+'.','','tech')}}
  });
}
function autoCharter(note){
  if(!st.pol.autoCharter)return;
  st.ships.filter(sh=>sh.status==='idle'&&manned(sh)&&canTrade(sh)).forEach(sh=>{
    let best=null,bs=0;
    st.offers.filter(o=>o.cls===sh.cls&&!(o.hra&&!av('hra'))).forEach(o=>{const p=estProfit(o,sh);if(p<=0)return;let s=p/o.months;if(st.pol.mode===0&&o.type==='VC')s*=1.15;if(st.pol.mode===2&&o.type==='TC')s*=1.25+o.months*0.01;if(s>bs){bs=s;best=o}});
    if(best){sh.status='voyage';sh.left=best.months;sh.c=fitFor(best,sh);st.offers=st.offers.filter(x=>x!==best);note('Chartering fixed '+sh.name+(best.type==='VC'?' '+best.from+' → '+best.to:' on a '+best.months+'-month time charter')+' for '+best.who+'.','','charter')}
    else note('Chartering found no profitable cargo for '+sh.name+' this month.','bad','charter');
  });
}

    {const ns=natStats(sh);if(ns.n>=3&&ns.e<3.8&&!(sh.langT>0))add(2,'We have '+ns.n+' nationalities on board. Half the crew cannot follow the safety briefing in English.','Language','bad');if(ns.n===1&&crewCount(sh)>6)add(1,'Everyone on board speaks the same language. Easy to work together.','Teamwork','good')}

/* ---------- crew ops ---------- */
function signOff(sh,r,note){
  const p=sh.crew[r];sh.crew[r]=null;p.fat=0;p.onb=0;p.seen=1;if(av('comp'))spend('allow',3000);spend('recruit',3500);

  if(back){p.ex=true;p.exAge=0;p.left=0;p.flag=false;p.comp=Math.min(98,p.comp+1);st.pool.push(p)}
  note(`${RANKS[r].t} ${p.name} signed off ${sh.name}${back?' and wants to rejoin later':''}.`,'','crew');
}
function sendHome(p){spend('recruit',5000);if(!p.flag&&Math.random()<st.morale/100){p.ex=true;p.exAge=0;p.left=0;st.pool.push(p)}}

/* ---------- office, HR and finance ---------- */
const lateChance=()=>0.07*(1.35-Math.min(1,eff('finance')))*[1.6,1,0.5][st.pol.credit]*(st.budget.finance===0?1.4:1);

  const s=st,fe=Math.min(1,eff('finance'));
  s.recv.forEach(r=>{r.age++;if(r.age<2)return;
    if(Math.random()<0.45+0.4*fe){earn('freight',r.amt);r.done=1;note(r.who+' finally paid '+fm(r.amt)+' for the '+r.ship+' voyage.','good','fin')}
    else if(r.age>=4){r.done=1;s.board-=3;note('Finance wrote off '+fm(r.amt)+' owed by '+r.who+'. The charterer went bust.','bad','fin')}});
  s.recv=s.recv.filter(r=>!r.done);
}
function officeMonth(note,mStart){
  const s=st,oc=officeCost();
  spend('office',oc.rent);spend('staff',oc.heads);spend('opay',oc.pay);spend('oben',oc.ben);DK().forEach(d=>spend('budget',deptBudget(d)));
  if(mStart%12===11&&ob('bonus')){const b=(staffCount()*oPay()+oc.heads)*ob('bonus');spend('obonus',b);note('Year-end bonus of '+ob('bonus')+' month'+(ob('bonus')>1?'s':'')+' paid to office staff and heads ('+fm(b)+').','good','hr')}
  const hrE=Math.min(1,eff('hr')),quit=[];
  DK().forEach(d=>{const n=s.staff[d];for(let i=0;i<n;i++){const p=clamp((70-s.omorale)/360,0.004,0.16)*(1.25-0.6*hrE)*(s.budget.hr===0?1.3:1);if(Math.random()<p){s.staff[d]--;quit.push(d)}}});
  if(quit.length){s.oLeft.push({m:mStart,n:quit.length});note(quit.length+' office staff resigned from '+[...new Set(quit)].map(d=>DNAME[d]).join(', ')+'. HR will try to refill the posts.','bad','hr')}
  s.oLeft=s.oLeft.filter(x=>x.m>mStart-12);
  if(s.omorale<40)DK().forEach(d=>{const h=s.heads[d];if(h&&Math.random()<0.06){s.heads[d]=null;note(h.name+', your '+DEPTS[d].t+', resigned because office morale is so low.','bad','hr')}});
  s.ramp={};let hired=0,missed=0;
  DK().forEach(d=>{let need=s.hc[d]-s.staff[d];while(need-->0){const ag=s.pol.hire===1;spend('recruit',ag?oPay():1500);let pr=ag?0.68+0.3*hrE:0.35+0.35*hrE;if(s.opay===0)pr*=0.7;if(s.budget.hr<=1)pr*=0.85;if(Math.random()<pr){s.staff[d]++;s.ramp[d]=(s.ramp[d]||0)+1;hired++}else missed++}});
  if(hired)note('HR hired '+hired+' new office staff. They need a month to settle in.','good','hr');
  if(missed)note('HR could not fill '+missed+' office vacanc'+(missed>1?'ies':'y')+' this month.','bad','hr');
  s.oShock*=0.7;s.omorale+=(oMoraleTarget()-s.omorale)*0.3;
}

/* ---------- turn ---------- */
function endMonth(){
  if(!st||st.over||st.queue.length)return;
  const s=st,notes=[],mStart=s.m;const note=(t,tone,cat)=>{notes.push({t,tone});addLog(t,tone,cat)};
  meetClose(note);
  const te=eff('technical');
  const payYard=amt=>{const pay=Math.min(Math.max(0,s.cash),amt);capOut(pay);const rest=amt-pay;if(rest>0)s.loan+=rest;return rest};

function boardReview(){

function ciiRatio(sh,y){const s=sp(sh),f=(ENGCF[s.eng]||1)*(s.eq||[]).reduce((a,k)=>a*(EQCF[k]||1),1);return f*(1+sh.age*0.012)*(st.fuelEff||1)*(sh.slowCii>0?0.9:1)/(1-0.02*((y??yearOf(st.m))-2027))}

  if(Object.keys(cnt).length)note('IMO carbon ratings (CII) for '+y+': '+CIIB.map(b=>b[0]).filter(k=>cnt[k]).map(k=>cnt[k]+' rated '+k).join(', ')+'. Charterers pay more for A and B ships and less for D and E.',bad.length?'bad':'','tech');

    st.ciiQ={kind:'event',id:'ciiPlan',title:'Carbon corrective plan needed',body:`${andList(bad.map(x=>x.name+' ('+x.ciiH.join(', ')+')'))} failed the IMO carbon rating. The flag state wants a corrective action plan in the ship's energy efficiency plan (SEEMP).`,facts:['A ship rated E once, or D three years in a row, must show how it will reach C.','Ratings get stricter every year, so older ships slide down even if nothing changes.'],ask:'What is the plan?',extra:{ids:bad.map(x=>x.id),cost}}}

function genAgenda(){
  const s=st;if(!s)return;const out=[],cd=s.meetCd||(s.meetCd={}),push=(k,p,key)=>{key=key||k;if(cd[key]>s.m)return;out.push({id:s.nid++,k,p,key})};

  if(idle.length){const g=segOf(idle[0].cls);push('idleNo',{ids:idle.map(x=>x.id),names:idle.map(x=>x.name),seg:g,idx:s.idx[g]})}
  s.divs.forEach(g=>{const v=s.idx[g];if(!s.ships.some(x=>segOf(x.cls)===g))return;if(v<0.8)push('cycle',{seg:g,dir:'low',v},'cycle'+g);else if(v>1.25)push('cycle',{seg:g,dir:'high',v},'cycle'+g)});
  const low=s.ships.filter(sh=>sh.cond<62&&canShore(sh));if(low.length)push('lowCond',{ids:low.map(x=>x.id),cost:low.reduce((a,x)=>a+shoreCost(x),0)});
  const due=s.ships.filter(sh=>sh.status==='idle'&&!tooOld(sh)&&dueIn(sh)<=3&&s.cash<dockCost(sh)*1.5);if(due.length){const sh=due[0];push('survey',{id:sh.id,cost:dockCost(sh),cond:Math.round(sh.cond)},'survey'+sh.id)}
  const tired=aboard(s,p=>p.fat>=78);if(tired.length)push('tired',{list:tired.slice(0,4).map(x=>({ship:x.sh.id,r:x.r,pid:x.p.id,name:x.p.name,sn:x.sh.name,fat:x.p.fat}))});
  const vac=s.ships.reduce((a,x)=>a+RK.filter(r=>!x.crew[r]).length,0);if(wageRatio()<0.95&&(vac||s.empRep<50))push('payGap',{wr:wageRatio(),vac});
  const mixed=s.pol.natMix?[]:s.ships.filter(sh=>{const n=natStats(sh);return n.n>=4&&n.e<3.8&&!(sh.langT>0)});if(mixed.length)push('mixed',{ids:mixed.map(x=>x.id),names:mixed.map(x=>x.name),n:Math.max(...mixed.map(x=>natStats(x).n))});

  const mn=mgmtNums();if(s.m>0&&mn.runway!=null&&mn.runway<2.5)push('runway',{run:mn.runway,cap:loanCap(),ltv:ltv()});

  if(ltv()>0.6)push('ltv',{ltv:ltv(),cash:s.cash});

  const ov=OPS.filter(d=>s.ships.length&&coverage(d)<0.7);if(ov.length)push('overload',{d:ov[0],cov:coverage(ov[0])},'overload'+ov[0]);

    it.d=A.d;it.best=A.best(it.p);it.cost=A.cost?A.cost(it.p):0;it.can=!A.policy&&!!h&&h.skill>=A.skill&&it.cost<=authOf(h);
    it.rec=!h?null:it.can||Math.random()<0.5+0.1*h.skill?it.best:pick([...Array(n).keys()].filter(i=>i!==it.best));return it})};
}
const meetPending=()=>st&&st.meet?st.meet.items.filter(i=>i.done==null&&!i.can).length:0;

      why=say(it.d,esc(r)+(it.rec!=null?` My recommendation: <b>${esc(opts[it.rec][0])}</b>.`:''),'me')}

  else act=`<div class="choices" style="margin-top:12px">${choices}<button type="button" class="choice" data-a="meet" data-v="${it.id}:-1"><b>Not now</b><span>Come back to it later. Nothing is done this month.</span></button></div>`;
  return `<article class="card"><div class="ship-head"><div style="min-width:0"><span class="chip">${DNAME[it.d]}</span><div class="ship-name" style="margin-top:8px;font-size:17px">${esc(A.title(it.p))}</div></div><span class="pill ${done?'p-del':it.can?'p-idle':'p-dock'}">${done?'Decided':it.can?'Manager\'s call':'Your decision'}</span></div>

function vMeeting(){

  const att=DK().map(d=>{const h=st.heads[d];return `<span>${DNAME[d]} <b class="${h?'':'down'}">${h?esc(h.name):'vacant'}</b>${h?' <span class="stars" style="font-size:12px">'+'★'.repeat(h.skill)+'</span>':''}</span>`}).join('');
  const quiet=memos().filter(m=>!its.some(i=>i.d===m.d));
  return `<section class="card"><div class="eyebrow-m">Management meeting · ${mlabel(st.m)}</div>
    <div class="facts" style="margin-top:8px">${att}</div>
    <div class="kpis k3">${kpi('On the agenda',its.length)}${kpi('Your decision',yours,yours?'down':'')}${kpi('Managers will handle',own)}</div>
    <p class="tip muted small" style="margin:12px 0 0">Each head brings their problem and a plan. Within their spending limit, they act on their own at month end unless you stop them. Company policy, big spending, or a vacant head comes to you. Anything you leave undecided is not done.</p></section>
  ${its.length?its.map(meetCard).join(''):'<section class="help">No one has an urgent problem this month. A quiet meeting is a good meeting.</section>'}
  ${quiet.length?`<h2>Other updates</h2><section class="card"><ul class="memo">${quiet.map(m=>`<li><div class="rk">${DNAME[m.d]} · ${esc(m.who)}</div><div class="${m.tone==='bad'?'down':''}">${esc(m.t)}</div></li>`).join('')}</ul></section>`:''}
  <h2>Meeting decisions</h2><section class="card">${memoLog('meet',8)}</section>`;
}
function meetSummary(){
  if(!st.meet)genAgenda();const its=st.meet.items;if(!its.length)return '<p class="muted" style="margin:0">All heads report no urgent issues this month.</p>';
  return `<ul class="memo">${its.map(it=>`<li class="${it.done!=null?'':it.can?'':'q-bad'}"><div class="rk">${DNAME[it.d]} · ${it.done!=null?'decided':it.can?'manager will handle':'needs your decision'}</div><div>${esc(AG[it.k].title(it.p))}</div></li>`).join('')}</ul>
    <div class="actions"><button type="button" class="btn primary" data-a="tab" data-v="meeting">Open the meeting${meetPending()?' · '+meetPending()+' for you':''}</button></div>`;
}

/* ---------- views ---------- */
function spark(vals,w,h){
  if(vals.length<2)return '';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-4-(v-mn)/r*(h-8)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const e=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="var(--soft)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${e[0]}" cy="${e[1]}" r="3.5" fill="var(--accent)"/></svg>`;
}
function arrow(now,prev){const d=now-prev;if(Math.abs(d)<0.005*prev)return '<span class="muted">flat</span>';return `<span class="${d>0?'up':'down'}">${d>0?'▲':'▼'} ${Math.abs(d/prev*100).toFixed(1)}%</span>`}
const kpi=(l,v,cls)=>`<div class="kpi"><small>${l}</small><b class="${cls||''}">${v}</b></div>`;
function condBar(label,v){const c=v>=70?'ok':v>=55?'mid':'low';return `<div class="cond ${c}"><div style="display:flex;justify-content:space-between"><span>${label}</span><b class="num">${Math.round(v)}</b></div><div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div></div>`}
function segRow(a,cur,labels){return `<div class="seg">${labels.map((l,i)=>`<button type="button" data-a="${a}" data-v="${i}" aria-pressed="${cur===i}">${l}</button>`).join('')}</div>`}
function polRow(k,labels){return `<div class="seg">${labels.map((l,i)=>`<button type="button" data-a="pol" data-v="${k}:${i}" aria-pressed="${st.pol[k]===i}">${l}</button>`).join('')}</div>`}
function memoLog(cat,n){const l=st.log.filter(x=>x.cat===cat).slice(0,n);return l.length?`<ul class="log">${l.map(x=>`<li><span class="m">${mlabel(x.m)}</span><span class="${x.tone}">${esc(x.t)}</span></li>`).join('')}</ul>`:'<p class="muted small" style="margin:0">Nothing yet. Activity appears after you end the month.</p>'}

const GA=['staff','opay','oben','obonus','budget','office','hseq','sever'],OPEXC=['wages','food','allow','insur','stores','mgmt'];
function mgmtNums(){
  const h=st.hist.slice(-3),L=st.hist[st.hist.length-1],sum=(x,c)=>c.reduce((a,k)=>a+(x.expD[k]||0),0);
  const n=st.ships.length,util=n?st.ships.filter(s=>s.status==='voyage').length/n:0;
  const opexDay=L&&n?sum(L,OPEXC)/n/30:0,ga=L?sum(L,GA):officeCostTotal();
  const rev3=h.reduce((a,x)=>a+x.rev,0),ga3=h.reduce((a,x)=>a+sum(x,GA),0),exp3=h.length?h.reduce((a,x)=>a+x.exp,0)/h.length:0;
  return {util,opexDay,ga,gaPct:rev3?ga3/rev3:null,ltv:ltv(),runway:exp3?st.cash/exp3:null};
}
function officeCostTotal(){const o=officeCost();return o.pay+o.ben+o.heads+o.budget+o.rent}
function memos(){
  const out=[],H=d=>st.heads[d]?st.heads[d].name:'Acting (post vacant)',add=(d,t,tone)=>out.push({d,t,tone});
  const idle=st.ships.filter(s=>s.status==='idle'&&manned(s)&&canTrade(s)).length;
  if(idle)add('chartering',idle+' ship'+(idle>1?'s are':' is')+' idle and ready. '+(st.pol.autoCharter?'I will fix them at month end if the numbers work.':'Auto-chartering is off, so please fix them in Contracts.'),'');
  if(st.budget.chartering<=1)add('chartering','With our budget cut, brokers are sending us fewer cargoes.','bad');
  const low=st.ships.filter(s=>s.cond<62&&s.status!=='dock').length;if(low)add('technical',low+' ship'+(low>1?'s are':' is')+' below 62% condition. Breakdowns become likely. I will send shore technicians.','bad');
  if(st.budget.technical<=1)add('technical','Spares stock is running low because of the budget. Ships are wearing faster.','bad');
  const vac=st.ships.reduce((a,s)=>a+RK.filter(r=>!s.crew[r]).length,0);if(vac)add('crewing',vac+' officer post'+(vac>1?'s are':' is')+' vacant. Ships cannot sail without full officers.','bad');
  if(wageRatio()<0.95)add('crewing','Our wage scale is '+Math.round(wageRatio()*100)+'% of market. Good officers are choosing other owners.','bad');
  const lv=ltv();if(lv>0.55)add('finance','Loan is '+Math.round(lv*100)+'% of fleet value. The bank covenant is 65%. We should not borrow more.',lv>0.65?'bad':'');
  const mn=mgmtNums();if(mn.runway!=null&&mn.runway<2.5&&st.m>0)add('finance','Cash covers only '+mn.runway.toFixed(1)+' months of spending. We need a buffer.','bad');
  const rv=recvSum();if(rv)add('finance','Clients still owe us '+fm(rv)+'. We are chasing it.','');
  if(st.omorale<50)add('hr','Office morale is '+Math.round(st.omorale)+'. '+st.oLeft.reduce((a,x)=>a+x.n,0)+' staff left in the last year. Check pay and benefits.','bad');
  OPS.forEach(d=>{const c=coverage(d);if(st.ships.length&&c<0.7)add('hr',DNAME[d]+' is overloaded, covering only '+Math.round(c*100)+'% of the fleet. Approve more headcount.','bad')});
  const exh=aboard(st,p=>p.fat>=75).length;if(exh)add('marine',exh+' officer'+(exh>1?'s are':' is')+' very tired or exhausted. Fatigue is the most common cause of accidents at sea.','bad');
  if(st.culture<40)add('marine','Safety culture is weak ('+Math.round(st.culture)+'). Crew are not reporting near misses, so we only hear about problems after accidents.','bad');
  if(!st.hseq&&st.rep<45)add('marine','Client reputation is low. An HSEQ programme would cut incidents and PSC findings.','');
  return out.slice(0,6).map(m=>({...m,who:H(m.d)}));
}

function statusPill(sh){
  if(tooOld(sh)&&sh.status==='idle')return '<span class="pill p-dock">Too old to trade</span>';
  if(surveyOverdue(sh)&&sh.status==='idle')return '<span class="pill p-dock">Survey due</span>';
  if(sh.status==='idle')return manned(sh)?'<span class="pill p-idle">Idle</span>':'<span class="pill p-dock">Undermanned</span>';
  if(sh.status==='voyage')return `<span class="pill p-voy">${sh.c.type==='TC'?'On charter':'At sea'} · ${sh.left} mo</span>`;
  if(sh.status==='dock')return `<span class="pill p-dock">${sh.emDock?'Emergency dock':'Dry dock'} · ${sh.left} mo</span>`;
  return '<span class="pill p-del">Delivery</span>';
}
function nameInput(id,ph,k){return `<div class="namebox"><label for="${id}">Ship name</label><input id="${id}" maxlength="30" placeholder="${esc(ph)}" value="${esc(drafts[id]||'')}" autocomplete="off" data-enter="${k}">${nameMsg&&nameMsg.k===k.split('|')[1]?`<div class="err">${esc(nameMsg.t)}</div>`:''}</div>`}
function fleetSummary(ships,label){

  const age=n?ships.reduce((a,s)=>a+s.age,0)/n:0,cond=n?ships.reduce((a,s)=>a+s.cond,0)/n:0,lm=ships.reduce((a,s)=>a+(s.lastNet||0),0),tot=ships.reduce((a,s)=>a+s.totR-s.totC,0);

}

    ${(()=>{if(!['idle','voyage'].includes(sh.status))return '';const sc=shoreCost(sh),plan=dueIn(sh)<=12,em=!plan&&sh.cond<40,b=[];

    </article>`;
}

function miniRow(sh){
  const lm=sh.lastNet||0,at=needsAttn(sh);
  return `<button type="button" class="mini-row" style="${tvar(sh.cls)}" data-a="fopen" data-v="${sh.id}"><span>${tBadge(sh.cls)}</span><span style="min-width:0"><span class="who">${esc(sh.name)}</span><span class="sub">${Math.floor(sh.age)} yrs · condition <b class="${sh.cond<62?'attn':''}">${Math.round(sh.cond)}%</b>${at?' · <b class="attn">needs attention</b>':''}</span></span><span class="rt">${statusPill(sh)}<span class="${lm<0?'down':'up'}" style="display:block;margin-top:4px">${fm(lm)}</span></span></button>`;
}
function vFleet(){
  if(!st.ships.length&&!st.orders.length)return `<section class="help">You have no ships. Buy one in <b>Buy & Sell</b>.</section>`;
  const segs=SEGS.filter(d=>st.ships.some(s=>segOf(s.cls)===d)||st.orders.some(o=>segOf(o.cls)===d));
  if(fleetTab!=='all'&&!segs.includes(fleetTab))fleetTab='all';
  const tabs=`<nav class="subtabs" aria-label="Fleets"><button type="button" data-a="ftab" data-v="all" aria-pressed="${fleetTab==='all'}">All fleets <span>${st.ships.length}</span></button>${segs.map(d=>`<button type="button" data-a="ftab" data-v="${d}" aria-pressed="${fleetTab===d}">${SEG[d]} <span>${st.ships.filter(s=>segOf(s.cls)===d).length}</span></button>`).join('')}</nav>`;
  const inSeg=fleetTab==='all'?st.ships:st.ships.filter(s=>segOf(s.cls)===fleetTab);
  if(fleetType!=='all'&&!inSeg.some(s=>s.cls===fleetType))fleetType='all';
  const byType=fleetType==='all'?inSeg:inSeg.filter(s=>s.cls===fleetType);
  const FL=[['all','All'],['sea','At sea'],['idle','Idle'],['dock','Dock'],['attn','Attention']];
  const cnt=k=>k==='all'?byType.length:k==='attn'?byType.filter(needsAttn).length:byType.filter(s=>stGroup(s)===k).length;
  const show=byType.filter(s=>fleetFilt==='all'||(fleetFilt==='attn'?needsAttn(s):stGroup(s)===fleetFilt));
  const ord=st.orders.filter(o=>(fleetTab==='all'||segOf(o.cls)===fleetTab)&&(fleetType==='all'||o.cls===fleetType));
  const types=[...new Set(show.map(s=>s.cls))].sort((a,b)=>typeOrder(a)-typeOrder(b));
  const label=fleetType!=='all'?CLS[fleetType].nama+' fleet':fleetTab==='all'?'Whole fleet':SEG[fleetTab]+' fleet';
  const ctrl=`<div class="ctrl"><div class="seg seg5" role="group" aria-label="Filter by status">${FL.map(([k,l])=>`<button type="button" data-a="ffilt" data-v="${k}" aria-pressed="${fleetFilt===k}">${l} <small class="num">${cnt(k)}</small></button>`).join('')}</div>
    <div class="seg" role="group" aria-label="View" style="flex:0 0 auto;min-width:0"><button type="button" data-a="fview" data-v="cards" aria-pressed="${fleetView==='cards'}">Cards</button><button type="button" data-a="fview" data-v="list" aria-pressed="${fleetView==='list'}">List</button></div></div>`;
  const filtNote=fleetType!=='all'?`<div class="ctrl"><span class="muted small">Showing only</span>${tBadge(fleetType)}<button type="button" class="linkbtn" data-a="ftype" data-v="${fleetType}">Show all types</button></div>`:'';
  const groups=types.map(k=>{const sh=show.filter(s=>s.cls===k);
    const head=`<div class="typeh" style="${tvar(k)}">${tBadge(k)}<span class="tn">${esc(CLS[k].nama)}</span><span class="muted small num">${sh.length}</span></div>`;
    if(fleetView==='list')return head+`<section class="card minicard">${sh.map(x=>fleetOpen===x.id?`<div style="padding:4px">${shipCard(x)}<div class="actions" style="padding:0 12px 12px"><button type="button" class="btn" data-a="fopen" data-v="${x.id}">Close</button></div></div>`:miniRow(x)).join('')}</section>`;
    return head+`<div class="ships">${sh.map(shipCard).join('')}</div>`}).join('');
  return `${tabs}
  ${fleetSummary(byType,label)}
  ${typeMonitor(inSeg)}
  ${ord.length?`<h2>On order</h2><section class="card pl">${ord.map(o=>`<div><span>${tBadge(o.cls)} <b>${esc(o.name||'Unnamed')}</b> · ${CLS[o.cls].nama}<br><span class="muted small">${stageNow(o)}</span></span><span class="muted">${o.left} mo</span></div>`).join('')}</section>`:''}
  <h2>Ships</h2>${filtNote}${ctrl}
  ${groups||`<section class="help">No ships match this filter.</section>`}
  <p class="muted small">Each ship type has its own code and outline, and each division its own shade of blue, so you can spot types at a glance. <b>Needs attention</b> means undermanned, survey due, too old, condition under 62% or certificate gaps. Ships dry dock once every 5 years for the class special survey (booking opens 12 months before it is due). In between, shore technicians fix wear while the ship trades, up to a limit that drops as the ship goes longer since its last dock. Emergency dry dock is only for major breakdowns or condition below 40%. Tankers and gas carriers stop getting charters at 22 years, other ships at 25. Profit per ship counts voyage revenue against crew, running, fuel, port, repair and dock costs. It leaves out head office overhead.</p>`;
}

function vContracts(){

    return `<article class="card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span><span class="chip">${o.type==='VC'?'Voyage charter':'Time charter'}</span>${o.hra?' <span class="tag warn">High risk area</span>':''}</span><span class="muted small">${c.nama}</span></div>
      <div class="route">${o.type==='VC'?esc(o.from)+' → '+esc(o.to):o.months+' months for '+esc(o.who)}</div>
      <div class="muted small">${o.type==='VC'?esc(o.cargo)+' · '+esc(o.who)+' · '+o.months+(o.months>1?' months':' month'):'Hire '+fm(o.hire)+'/month · '+esc(o.cargo)}</div>
      <div class="money"><div><small>${o.type==='VC'?'Freight':'Total hire'}</small><b class="num">${fm(o.rev)}</b></div><div><small>Est. cost</small><b class="num">${fm(cost)}</b></div><div><small>Est. profit</small><b class="num ${prof<0?'down':'up'}">${fm(prof)}</b></div></div>
      ${ok.length?`<div class="assign"><select id="sel-${o.id}" aria-label="Choose a ship">${ok.map(s=>{const m=emOf(s);return `<option value="${s.id}">${esc(s.name)} (${Math.round(s.cond)}%)${Math.abs(m-1)>0.005?' · rate '+(m>1?'+':'')+Math.round((m-1)*100)+'%':''}</option>`}).join('')}</select><button type="button" class="btn primary" data-a="accept" data-v="${o.id}">Fix now</button></div>`:`<div class="muted small" style="margin-top:12px">No idle ${c.nama} ready.</div>`}
    </article>`}).join('');
  return `<section class="help">${st.pol.autoCharter?`Your Chartering Manager fixes idle ships automatically at the end of each month (${['voyage charters first','balanced','time charters first'][st.pol.mode]}). You can still fix a ship yourself here.`:'Auto-chartering is off. Fix ships yourself here, or turn it on in Departments.'}</section>
  <h2>Chartering activity</h2><section class="card">${memoLog('charter',6)}</section>
  <h2>Offers on the market</h2><div class="offers">${cards}</div>`;
}

  const gap=st.hc[d]-st.staff[d];
  return `<div class="wage-row" style="border-top:0;padding-bottom:0"><div><b>Team size</b><div class="muted small">${st.staff[d]} in seat${gap>0?` · <span class="down">${gap} vacant</span>`:''} · approved ${st.hc[d]} · each covers ${per}<br>Covers ${Math.round(cov*100)}% of your ${tgt}</div></div>

const SHORT={scrub:'Scrubber',coat:'Silicone hull',esd:'Energy-saving fins',shaft:'Shaft generator',reefer:'Reefer plugs',geared:'Own cranes',coatTank:'Coated tanks',mfm:'Mass flow meter',reliq:'Reliquefaction',dp2:'DP2',fifi:'Fi-Fi 1',freefall:'Free-fall lifeboat',mist:'Water mist',ibs:'Integrated bridge',gasdet:'Gas detection',cms:'Engine monitoring',citadel:'Citadel',cabins:'Single cabins',hosp:'Ship hospital'};

const BANDS={young:{l:'Young',d:'3–7 yrs',a:[3,7]},mid:{l:'Mid-age',d:'8–12 yrs',a:[8,12]},old:{l:'Older',d:'13–18 yrs',a:[13,18]}};

function chart12(){
  const h=st.hist.slice(-12);if(!h.length)return '<p class="muted">The chart appears after your first month.</p>';
  const W=Math.max(320,h.length*48),H=170,pad=34,mx=Math.max(...h.map(x=>Math.max(x.rev,x.exp)))||1,bw=(W-pad)/h.length;
  const y=v=>H-22-(v/mx)*(H-40);
  let g='';for(let i=0;i<=2;i++){const v=mx*i/2,yy=y(v);g+=`<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${pad-4}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--muted)">${(v/1e6).toFixed(0)}M</text>`}
  h.forEach((x,i)=>{const x0=pad+i*bw+bw*0.15,w=bw*0.33;g+=`<rect x="${x0}" y="${y(x.rev)}" width="${w}" height="${H-22-y(x.rev)}" rx="2" fill="var(--accent)"/><rect x="${x0+w+2}" y="${y(x.exp)}" width="${w}" height="${H-22-y(x.exp)}" rx="2" fill="var(--muted)" opacity=".55"/><text x="${x0+w}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${MONTHS[x.m%12]}</text>`});
  return `<div class="chart-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenue and expenditure by month">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>Revenue</span><span><i style="background:var(--muted);opacity:.55"></i>Expenditure</span></div>`;
}

  <h2>Offices</h2>

  <div class="offers">${Object.entries(OFFICES).map(([k,o])=>{const open=st.offices.includes(k);return `<article class="card"><div class="ship-head"><div><b>${o.n}</b><div class="muted small">${o.d}</div></div>${open?'<span class="pill p-voy">Open</span>':''}</div>
    <div class="facts" style="margin-top:8px"><span>Rates <b>${Object.entries(o.boost).map(([s,b])=>SEG[s]+' +'+Math.round(b*100)+'%').join(', ')}</b></span><span>Running <b class="num">${fm(o.mo)}</b>/mo</span></div>
    ${open?'':`<div class="actions"><button type="button" class="btn" data-a="office" data-v="${k}" ${st.cash<o.cost?'disabled':''}>Open office · ${fm(o.cost)}</button></div>`}</article>`}).join('')}</div>
  <h2>Glossary</h2>
  <section class="card"><dl class="gloss">
    <dt>Marine Supt</dt><dd>Marine Superintendent. Usually a former Master. Looks after safety, PSC and vetting readiness, and officer performance.</dd>
    <dt>Technical Supt</dt><dd>Technical Superintendent. Usually a former Chief Engineer. Looks after maintenance, repairs and dry docks.</dd>
    <dt>STCW</dt><dd>IMO convention on training and certification of seafarers. Codes like A-VI/1 refer to its sections.</dd>
    <dt>CoC</dt><dd>Certificate of Competency. Class 1 for Master and Chief Engineer, Class 2 for Chief Officer and 2nd Engineer.</dd>
    <dt>SIRE</dt><dd>Oil majors' ship inspection scheme. Tankers and gas carriers need clean vetting to get good charters.</dd>
    <dt>DP</dt><dd>Dynamic positioning. Keeps offshore vessels in place by computer. Officers need a Nautical Institute DP certificate.</dd>
    <dt>MLC 2006</dt><dd>Maritime Labour Convention, covering wages, food, rest hours and repatriation.</dd>
    <dt>IBF</dt><dd>International Bargaining Forum. Sets crew rights in high-risk areas, including bonus pay.</dd>
    <dt>TEU / DWT / cbm</dt><dd>Container capacity / cargo weight / gas tank volume.</dd>
    <dt>AHTS / PSV</dt><dd>Anchor handling tug supply vessel / platform supply vessel, used in offshore oil and gas.</dd>
    <dt>PSC</dt><dd>Port State Control, inspection of foreign ships by port authorities.</dd>
    <dt>Off-hire</dt><dd>The ship cannot perform, so the charterer stops paying hire.</dd>
    <dt>Special survey</dt><dd>Class society inspection every 5 years. The ship must go into dry dock so the hull, propeller and tanks can be checked.</dd>
    <dt>Shore repair</dt><dd>Repairs done by technicians from shore while the ship is alongside or at anchor, without going into a dry dock.</dd>
    <dt>Near miss</dt><dd>An event that could have caused harm but did not. Reporting them is how fleets prevent real accidents.</dd>
    <dt>Root cause</dt><dd>The underlying reason a mistake happened, such as fatigue or a bad procedure, rather than just who made it.</dd>
    <dt>Just culture</dt><dd>Crew are not punished for honest mistakes, but deliberate rule-breaking is not tolerated.</dd>
    <dt>LOA</dt><dd>Length overall, from the tip of the bow to the stern. Ports, locks and berths limit how long a ship can be.</dd>
    <dt>Scrubber</dt><dd>Cleans sulphur from the exhaust so the ship can burn cheaper high-sulphur fuel under IMO 2020 rules.</dd>
    <dt>MFM</dt><dd>Mass flow meter. Measures fuel delivered by a bunker tanker. MPA requires it in Singapore.</dd>
    <dt>DP2</dt><dd>Dynamic positioning with back-up systems, so a single failure does not move the vessel off position.</dd>
    <dt>Steel cutting</dt><dd>Shipbuilding milestones: steel cutting, keel laying, launching and delivery. The owner pays the yard at each stage.</dd>
    <dt>Flag state</dt><dd>The country where the ship is registered. Its laws apply on board, and it affects cabotage rights and PSC inspections.</dd>
    <dt>LDT</dt><dd>Lightweight tonnage, the weight of the empty ship. Used to price demolition.</dd>
    <dt>CII</dt><dd>Carbon Intensity Indicator. IMO rates every ship A to E each year on carbon per cargo mile, and the limits tighten every year. A ship rated E once, or D three years in a row, needs a corrective plan.</dd>
    <dt>P&I club</dt><dd>Protection and indemnity insurance, run by shipowners as mutual clubs. Covers crew injury, pollution and cargo claims. Renews every 20 February.</dd>
    <dt>IG club</dt><dd>One of the International Group P&I clubs. Oil majors and LNG charterers expect them. Cheaper non-IG clubs exist.</dd>
    <dt>Deductible</dt><dd>The part of each claim the owner pays before insurance pays the rest.</dd>
    <dt>Laytime</dt><dd>The time a voyage charterer is allowed for loading and discharging.</dd>
    <dt>Demurrage</dt><dd>Money the charterer pays the owner for each day the ship waits beyond laytime, for example in port congestion.</dd>
    <dt>Covenant</dt><dd>A condition in the loan agreement, such as keeping the loan under 65% of fleet value. A waiver lets you breach it for a while.</dd>
    <dt>Class extension</dt><dd>A short delay of a class survey, granted by the surveyor only if the ship is in good condition.</dd>
    <dt>Slow steaming</dt><dd>Sailing slower to burn less fuel and cut carbon. Fewer voyages a year, so less income.</dd>
    <dt>Authority</dt><dd>How much a manager may spend without asking the CEO. Stronger managers get bigger limits.</dd>
  </dl></section>
  <div><button type="button" class="btn ${confirmKey==='reset'?'danger':''}" data-a="reset">${confirmKey==='reset'?'Tap again to start over':'Start a new game'}</button></div>`;
}

/* ---------- push crewing: rush hire through the agency ---------- */
const RUSH_SR=20000,RUSH_JR=4000;
const rushSr=sh=>RK.filter(r=>!sh.crew[r]&&!isHeld(sh,r));
const rushN=sh=>rushSr(sh).length+jrVac(sh).length;
const rushCost=sh=>rushSr(sh).length*(RUSH_SR+7500)+jrVac(sh).length*(RUSH_JR+3000);
function rushShip(sh){
  const ce=eff('crewing'),mean=44+st.empRep*0.3+Math.min(1,ce)*20,seg=cseg(sh.cls),got=[];
  rushSr(sh).forEach(r=>{
    let c=[0,1,2,3,4,5].map(()=>genSeafarer(r,{mean,seg,boost:0.15})).concat(st.pool.filter(p=>p.rank===r&&!p.sour));
    const ok=c.filter(p=>p.rep>=MINREP[st.pol.minRep]);if(ok.length)c=ok;
    c.sort((a,b)=>b.comp-a.comp);const p=c[0];
    p.wage=Math.round(Math.max(st.wages[r],p.expect)*1.1/100)*100;
    spend('recruit',RUSH_SR);place(sh,r,p);got.push(RANKS[r].t+' '+p.name);
  });
  const jv=jrVac(sh);jv.forEach(r=>{spend('recruit',RUSH_JR);hireJr(sh,r)});
  if(jv.length)got.push(jv.length+' junior crew');
  if(got.length)addLog('Push Crewing: agency rushed '+got.join(', ')+' to '+sh.name+'. Officers signed at 10% above scale.','good','crew');
  return got.length;
}
function crewWhy(){
  const out=[],h=st.heads.crewing,cov=coverage('crewing');
  if(!h)out.push('No Crewing Manager. Hire one in <b>Departments</b>, this is the biggest fix.');
  else if(h.skill<3)out.push('Your Crewing Manager is weak (skill '+h.skill+'/5). A stronger manager finds better officers.');
  if(cov<1)out.push('Crewing team is stretched: '+(1+st.staff.crewing)+' people for '+st.ships.length+' ships. Each person handles about 3 ships. Add staff in <b>HR & Office</b>.');
  if(st.budget.crewing<2)out.push('Crewing budget is <b>'+BUDGET[st.budget.crewing].l+'</b>. Agencies send fewer candidates.');
  if(st.pol.minRep>0)out.push('Reputation rule <b>'+['any','3.5+','4.0+'][st.pol.minRep]+'</b> rejects many candidates.');
  if(st.pol.needStcw&&!st.pol.autoTrain)out.push('STCW is required but auto-training is off, so anyone missing a certificate is rejected.');
  if(PREM[st.pol.premium]===0)out.push('Crewing cannot offer anything above your wage scale, so officers who ask a little more walk away.');
  if(wageRatio()<1)out.push('Your wage scale is '+Math.round(wageRatio()*100)+'% of market. Officers prefer better-paying companies. Raise it in <b>Crew Pay</b>.');
  if(st.empRep<50)out.push('Employer rating is low ('+Math.round(st.empRep)+'/100). Better crew morale and wages lift it over time.');
  return out;
}

/* ---------- live time: 1 real hour away = 1 game month ---------- */
const HOUR=3600000,MAX_OWED=12;let catching=false;
const liveOn=()=>st&&st.rt!==false;
function minsLeft(){return Math.max(1,60-Math.floor((Date.now()-(st.clock||Date.now()))/60000))}
function whenTxt(){if(!st)return '';if(st.over)return 'Game over';let t=mlabel(st.m);if(liveOn())t+=(st.owed?' · '+st.owed+' month'+(st.owed>1?'s':'')+' waiting':' · next in '+minsLeft()+' min');return t}
function syncClock(){
  if(!st||st.over)return;
  if(!st.clock)st.clock=Date.now();
  if(!liveOn()){st.clock=Date.now();return}
  const h=Math.floor((Date.now()-st.clock)/HOUR);
  if(h>0){st.owed=Math.min(MAX_OWED,(st.owed||0)+h);st.clock+=h*HOUR;save()}
  if(st.owed&&!st.queue.length)catchUp();
  else{const w=document.querySelector('.when');if(w)w.textContent=whenTxt()}
}
function catchUp(){
  if(catching||!st||!st.owed||st.queue.length||st.over)return;
  catching=true;let n=0,rev=0,exp=0,notes=[];const m0=st.m;
  try{
    while(st.owed>0&&!st.over&&!st.queue.length){
      const before=st.m;endMonth();if(st.m===before)break;
      st.owed--;n++;
      st.queue=st.queue.filter(q=>{if(q.kind!=='report')return true;rev+=q.rev;exp+=q.exp;q.notes.forEach(x=>{if(x.tone)notes.push(x)});return false});
    }
  }finally{catching=false}
  if(n)st.queue.unshift({kind:'away',n,rev,exp,notes,m0,wait:st.queue.length>0});
  save();render();
}
function liveCard(){
  return `<section class="card"><div class="ship-head"><div><h3>Live time ${liveOn()?'on':'off'}</h3><div class="muted small" style="margin-top:4px">${liveOn()?'Every hour you are away, one month passes. Decisions pause the clock until you answer them. Up to '+MAX_OWED+' months can build up.':'Months only pass when you tap End month.'}</div></div><button type="button" class="btn" data-a="rtToggle">${liveOn()?'Turn off':'Turn on'}</button></div></section>`;
}

function whyBlocked(a,v){
  if(!st||!isCareer()||UI_ACTS.has(a))return null;
  const chk=(d,r)=>can(d,r)?null:needMsg(d,r);
  switch(a){
    case 'accept':return chk('chartering',1);
    case 'man':case 'train':case 'rush':return chk('crewing',1);
    case 'wage':case 'nat':return chk('crewing',2);
    case 'allow':return chk('crewing',3);
    case 'shore':return chk('technical',1);
    case 'maint':return chk('technical',2);
    case 'dock':return chk('technical',3);
    case 'hseq':return chk('marine',3);
    case 'pol':{const k=(v||'').split(':')[0];return chk(POLD[k]||'ceo',2)}
    case 'budget':case 'staff':{const d=(v||'').split(':')[0];if(cfo())return null;return chk(d,3)}
    case 'opay':case 'oben':if(cfo())return null;return chk('hr',3);
    case 'borrow':case 'repay':return cfo()?null:needMsg('finance',4);
    case 'appoint':case 'dismiss':{const d=(v||'').split(':')[0];if(st.heads[d]&&st.heads[d].me)return 'You cannot replace yourself.';return chk(d,4)}
    case 'meet':{const [id]=(v||'').split(':');const it=st.meet&&st.meet.items.find(x=>x.id===+id);return it&&canMeet(it)?null:'The CEO chairs this meeting. You can decide items for '+andList(myDepts().map(x=>DNAME[x]))+' once you are Head of Department.'}
    case 'renameStart':case 'rename':return st.me.rank===4&&myTrack()==='coo'?null:needMsg('ceo',5);
    case 'svy':return chk('marine',1);
    case 'prep':{const r=REGS.find(x=>x.id===v);return r&&r.act?chk(r.act.d,r.act.r):null}
    case 'gPromote':{const d=(v||'').split(':')[0];if(cfo()||can('hr',3))return null;return chk(d,3)}
    case 'cxHire':case 'cxDismiss':return needMsg('ceo',5);
  }
  return needMsg('ceo',5);
}

function genTasks(){const m=st.me;if(!m||m.rank>=5){if(m)m.tasks=[];return}
  const pool=m.rank===4?CX[myTrack()].depts:[m.dept],n=LADDER[m.rank].n,used=new Set(),out=[];let guard=0;
  while(out.length<n&&guard++<40){const d=pick(pool),L=TASKS[d],i=Math.floor(Math.random()*L.length);if(used.has(d+i)||(m.last||[]).includes(d+i))continue;used.add(d+i);const x=tctx(),tk=L[i](x),ord=tk.c.map((_,j)=>j).sort(()=>Math.random()-0.5);out.push({id:st.nid++,d,key:d+i,t:tk.t,b:tk.b,ord,c:ord.map(j=>[tk.c[j][0],tk.c[j][1]]),x:{sid:x.sh?x.sh.id:null},done:null})}
  m.last=out.map(t=>t.key);m.tasks=out}
function doTask(id,i){const m=st.me,tk=m&&m.tasks.find(t=>t.id===id);if(!tk||tk.done!=null)return;
  const [d,ix]=[tk.key.replace(/\d+$/,''),+tk.key.match(/\d+$/)[0]];const x=tctx();x.sh=tk.x.sid!=null?shipById(tk.x.sid):x.sh;if(x.sh)x.sn=x.sh.name;
  const tpl=TASKS[d][ix](x),ch=tpl.c[tk.ord?tk.ord[i]:i];if(!ch)return;const [res,tone]=ch[3](st,x);tk.done=i;tk.score=ch[2];tk.res=res;tk.tone=tone;fix();addLog('My job · '+tk.t+': '+res,tone,'me')}

function compParts(){

  if(lap)p.push(['Ships with invalid certificates',-Math.min(36,lap*12)]);if(ov)p.push(['Annual surveys overdue',-ov*3]);if(eS)p.push(['Ships rated CII E',-eS*4]);

function imoMonth(note,mStart){
  const s=st;s.ready=s.ready||{};const n=s.ships.length,next=mStart+1;
  const itc=(IT_CYB[s.pol.cyber??1].c+IT_SYS[s.pol.itsys??1].c)*n;if(itc)spend('it',itc);
  s.ships.forEach(sh=>{annInit(sh);

    if(sh.status==='delivery')return;

    if(mStart>=sh.annDue-1&&s.pol.autoSvy&&Math.random()<0.3+0.55*Math.min(1,eff('marine'))){const c=svyCost(sh);spend('imo',c);sh.annDue+=12;note(sh.name+' passed its annual statutory survey ('+fm(c)+'). Certificates endorsed until '+mlab(sh.annDue)+'.','','marine');return}
    if(mStart>sh.annDue+3){sh.lapsed=true;note(sh.name+'\'s annual survey window closed. Its SOLAS, MARPOL and Load Line certificates are now invalid, so PSC can detain it.','bad','marine')}

  return null}
function npcBuyExec(m,L,who){if(L>0)st.loan+=L,st.cash+=L;capOut(m.price);spend('commission',m.price*0.01);const sh=newShip(m.cls,m.age,false);sh.spec=m.spec||null;sh.port='Singapore';sh.cond=m.cond;sh.status='delivery';sh.left=1;annInit(sh);st.ships.push(sh);st.market=st.market.filter(x=>x!==m);if(st.ceo&&!who)st.ceo.lastBuy=st.m;
  const t=(who||'CEO '+st.ceo.name)+' bought '+sh.name+' ('+CLS[m.cls].nama+', '+m.age+' years old) for '+fm(m.price)+(L?', with a bank loan of '+fm(L):'')+'.';addLog(t,'good');return t}
function npcScrap(){const out=[];st.ships.filter(sh=>tooOld(sh)&&sh.status==='idle').forEach(sh=>{try{const p=scrapVal(sh);capIn(p);filled(sh).forEach(r=>sendHome(sh.crew[r]));(sh.jr||[]).forEach(sendHome);st.ships=st.ships.filter(x=>x!==sh);const t='CEO '+st.ceo.name+' sold '+sh.name+' for recycling at an authorised yard for '+fm(p)+'.';addLog(t,'');out.push(t)}catch(e){}});return out}
function consulted(){const m=st.me;return m&&(m.rank===4||(m.rank===3&&['chartering','technical','finance'].includes(m.dept)))}
function npcFleet(m0){if(!isCareer()||st.over)return;const S=ceoStyle(),notes=npcScrap();
  if(m0%3===2&&st.cash>0&&st.m-(st.ceo.lastBuy??-99)>=S.gap&&!st.queue.some(q=>q.id==='npcBuy')){const p=npcPlan();
    if(p){if(consulted()){const m=p.m;st.queue.push({kind:'event',id:'npcBuy',extra:{mid:m.id,L:p.L},title:'CEO wants to buy a ship',body:`${st.ceo.name} wants to buy a ${m.age}-year-old ${CLS[m.cls].nama} for ${fm(m.price)}${p.L?', borrowing '+fm(p.L)+' from the bank':' from cash'}. Cash now ${fm(st.cash)}, loan ${fm(st.loan)}. As ${myShort()}, your view counts.`,ask:'What do you advise?'})}
      else notes.push(npcBuyExec(p.m,p.L))}}
  const rep=st.queue.find(q=>q.kind==='report'&&q.m===m0);if(rep)notes.forEach(t=>rep.notes.push({t,tone:'good'}))}
EV_DOM.npcBuy='any';
EVENTS.npcBuy={elig:()=>[],choices:[
  ['Support the purchase','The CEO goes ahead.',(s,sh,q)=>{const m=s.market.find(x=>x.id===q.extra.mid);if(!m||s.cash+q.extra.L<m.price*1.01)return ['The ship was sold to another owner before the deal closed.',''];s.me.perf=Math.min(100,s.me.perf+1);return [npcBuyExec(m,q.extra.L),'good']}],
  ['Advise against it','Keep the cash. The CEO may still decide to buy.',(s,sh,q)=>{const m=s.market.find(x=>x.id===q.extra.mid);if(m&&Math.random()<0.3){return ['The CEO overruled you. '+npcBuyExec(m,q.extra.L),'']}s.ceo.lastBuy=s.m;return ['The CEO took your advice and held off for now.','']}]]};

/* ---------- CEO sets direction, the C-suite runs the day-to-day ---------- */
const DELEG=[{l:'I decide',d:'Everything in their area comes to you.'},{l:'Big items to me',d:'They decide routine items. Spending over RM 3M, policy shifts with big risk and major events come to you.'},{l:'Fully delegated',d:'They decide everything in their area and report back.'}];
const DIR={
  spend:{t:'Spending',d:'How your leadership team handles incidents, repairs and claims.',lv:['Lean','Balanced','Quality first']},
  growth:{t:'Fleet growth',d:'Whether the COO and CFO bring you ships to buy each quarter.',lv:['Hold cash','Steady','Expand']}};
const BIG_EV=new Set(['refi','union','tender','redsea','bigBreak','cii','ciiPlan','claim','squeeze']);
const ceoMode=()=>!!(st&&!isCareer());
function cxFor(d){const k=CXOF(d),h=k&&st.cx&&st.cx[k];return h&&!h.me?{k,h}:null}
function delegOf(k){st.deleg=st.deleg||{coo:1,cfo:1,cto:1};return st.deleg[k]??1}
function dirOf(k){st.dir=st.dir||{spend:1,growth:1};return st.dir[k]??1}
/* meeting items: the C-suite decides as soon as the agenda is set */
function cxMeet(){if(!ceoMode()||!st.meet||!st.cx)return;
  st.meet.items.forEach(it=>{if(it.done!=null)return;const c=cxFor(it.d);if(!c)return;const lv=delegOf(c.k);if(lv===0)return;
    if(lv===1&&(it.cost||0)>3e6){it.esc=c.k;return}
    const n=AG[it.k].opts(it.p).length,good=Math.random()<0.55+0.08*c.h.skill;const i=good||n<2?it.best:pick([...Array(n).keys()].filter(x=>x!==it.best));
    meetDo(it,i);const L0=st.log[0];if(L0&&L0.t===DNAME[it.d]+': '+it.res)L0.t=DNAME[it.d]+' · '+c.h.name+' ('+CX[c.k].s+') decided: '+it.res;it.res=c.h.name+' ('+CX[c.k].s+') decided: '+it.res;it.byCx=c.k})}
/* events: handled by the C-suite and reported, unless escalated */
function cxPick(ch){const s=dirOf('spend'),n=ch.length;if(n<2)return 0;if(s===0)return Math.random()<0.5?n-1:0;if(s===1)return Math.random()<0.85?0:n-1;return 0}
function cxQueue(m0){if(!ceoMode()||!st.cx)return;const notes=[];
  st.queue=st.queue.filter(q=>{if(q.kind!=='event'||q.result)return true;const d=EV_DOM[q.id];if(!d||d==='any'||d==='ceo'||!DEPTS[d])return true;const c=cxFor(d);if(!c)return true;const lv=delegOf(c.k);
    if(lv===0||(lv===1&&(BIG_EV.has(q.id)||(q.id==='docAudit'&&q.extra&&q.extra.tier==='C'))))return true;
    const e=EVENTS[q.id];if(!e)return true;try{const sh=q.ship!=null?shipById(q.ship):null,ch=typeof e.choices==='function'?e.choices(q):e.choices;if(!ch||!ch.length)return true;const i=cxPick(ch),[res,tone]=ch[i][2](st,sh,q);
      const t=c.h.name+' ('+CX[c.k].s+') handled "'+q.title+'": '+ch[i][0]+'. '+res;addLog(t,tone);notes.push({t,tone});return false}catch(err){return true}});
  fix();const rep=st.queue.find(q=>q.kind==='report'&&q.m===m0);if(rep&&notes.length)rep.notes.unshift(...notes)}
/* fleet growth proposals for the CEO */
function cxGrowth(m0){if(!ceoMode()||!st.cx)return;const g=dirOf('growth');if(!g||m0%3!==2)return;const who=st.cx.coo||st.cx.cfo;if(!who||st.queue.some(q=>q.id==='cxBuy'))return;
  const S=CEO_STYLE[g===2?'growth':'balanced'];if(st.m-(st.cxLastBuy??-99)<S.gap||st.cash<=0)return;const p=npcPlan(S);if(!p)return;const m=p.m;
  st.queue.push({kind:'event',id:'cxBuy',extra:{mid:m.id,L:p.L},title:'Your team proposes a ship purchase',body:`${who.name} (${st.cx.coo?'COO':'CFO'}) recommends buying a ${m.age}-year-old ${CLS[m.cls].nama} for ${fm(m.price)}${p.L?', with a bank loan of '+fm(p.L):' from cash'}. Cash now ${fm(st.cash)}, loan ${fm(st.loan)}.`,ask:'Approve the purchase?'})}
EV_DOM.cxBuy='any';
EVENTS.cxBuy={elig:()=>[],choices:[
  ['Approve','Your team completes the deal.',(s,sh,q)=>{const m=s.market.find(x=>x.id===q.extra.mid);if(!m||s.cash+q.extra.L<m.price*1.01)return ['Another owner bought the ship first.',''];s.cxLastBuy=s.m;return [npcBuyExec(m,q.extra.L,'Your team'),'good']}],
  ['Reject','Keep the cash for now.',s=>{s.cxLastBuy=s.m;return ['The team will look again next quarter.','']}]]};
function vDirection(){if(!ceoMode())return '';const any=st.cx&&Object.values(st.cx).some(Boolean);
  return `<h2>Company direction</h2><section class="card"><p class="tip muted small" style="margin:0">As CEO you set the direction. Your COO, CFO and CTO make the day-to-day calls in their areas and report back in the monthly report.${any?'':' <b>Appoint them below first.</b>'}</p>
  <div class="setting"><h3>Commercial strategy</h3><div class="muted small">How Chartering employs the fleet.</div>${polRow('mode',['Voyage first','Balanced','Time charter first'])}</div>
  ${Object.entries(DIR).map(([k,o])=>`<div class="setting"><h3>${o.t}</h3><div class="muted small">${o.d}</div><div class="seg">${o.lv.map((l,i)=>`<button type="button" data-a="dir" data-v="${k}:${i}" aria-pressed="${dirOf(k)===i}">${l}</button>`).join('')}</div></div>`).join('')}
  ${Object.keys(CX).map(k=>{const h=st.cx&&st.cx[k];return `<div class="setting"><h3>${CX[k].s}: ${h?esc(h.name):'vacant'}</h3><div class="muted small">${h?DELEG[delegOf(k)].d:'No '+CX[k].s+', so '+andList(CX[k].depts.map(d=>DNAME[d]))+' decisions come to you.'}</div>${h?`<div class="seg">${DELEG.map((x,i)=>`<button type="button" data-a="deleg" data-v="${k}:${i}" aria-pressed="${delegOf(k)===i}">${x.l}</button>`).join('')}</div>`:''}</div>`}).join('')}</section>`}

const _vMeeting=vMeeting;
vMeeting=function(){const h=_vMeeting();if(!ceoMode())return h;const its=(st.meet&&st.meet.items)||[],by=its.filter(i=>i.byCx).length,esc_=its.filter(i=>i.esc&&i.done==null).length,any=st.cx&&Object.values(st.cx).some(Boolean);
  const box=any?`<section class="help">Your leadership team already decided ${by} item${by===1?'':'s'} this month.${esc_?' '+esc_+' big item'+(esc_>1?'s are':' is')+' waiting for you.':''} Change how much they decide in <b>Office · Departments</b>.</section>`:`<section class="help">You are deciding everything yourself because you have no COO, CFO or CTO. Appoint them in <b>Office · Departments</b> and they will handle routine items while you set the direction.</section>`;
  return box+h};

window.claude?.hot?.snapshot?.(()=>({st,tab,fleetTab,spTab,spMode,design,mapReg,mapSel,crewSel,fleetType,fleetView,fleetFilt}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
